name: Verify Movie Mentor Released Reservation Retry Authority

on:
  push:
    paths:
      - "ai/MovieMentorInferenceSpendMongoStore.js"
      - "scripts/verify-movie-mentor-released-reservation-retry-authority.mjs"
      - ".github/workflows/verify-movie-mentor-released-reservation-retry-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorInferenceSpendMongoStore.js"
      - "scripts/verify-movie-mentor-released-reservation-retry-authority.mjs"
      - ".github/workflows/verify-movie-mentor-released-reservation-retry-authority.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Syntax check
        run: node --check scripts/verify-movie-mentor-released-reservation-retry-authority.mjs
      - name: Verify released reservation retry authority
        run: node scripts/verify-movie-mentor-released-reservation-retry-authority.mjs
