name: Verify Movie Mentor Specialist Provider Evidence Authority

on:
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorSpecialistExecutor.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/StructuredAIProviderClient.js"
      - "scripts/verify-movie-mentor-specialist-provider-evidence-authority.mjs"
      - ".github/workflows/verify-movie-mentor-specialist-provider-evidence-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorSpecialistExecutor.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/StructuredAIProviderClient.js"
      - "scripts/verify-movie-mentor-specialist-provider-evidence-authority.mjs"
      - ".github/workflows/verify-movie-mentor-specialist-provider-evidence-authority.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Verify specialist provider-effect evidence authority
        run: node scripts/verify-movie-mentor-specialist-provider-evidence-authority.mjs
