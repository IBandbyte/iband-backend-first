name: Verify Movie Mentor Journey Recovery Production Boot Activation

on:
  push:
    paths:
      - "server.js"
      - "ai/MovieMentorJourneyRecoveryProductionBootActivation.js"
      - "ai/MovieMentorJourneyRecoveryActivationLeaseComposition.js"
      - "scripts/verify-movie-mentor-journey-recovery-production-boot-activation.mjs"
      - ".github/workflows/verify-movie-mentor-journey-recovery-production-boot-activation.yml"
  pull_request:
    paths:
      - "server.js"
      - "ai/MovieMentorJourneyRecoveryProductionBootActivation.js"
      - "ai/MovieMentorJourneyRecoveryActivationLeaseComposition.js"
      - "scripts/verify-movie-mentor-journey-recovery-production-boot-activation.mjs"
      - ".github/workflows/verify-movie-mentor-journey-recovery-production-boot-activation.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check server.js
      - run: node --check ai/MovieMentorJourneyRecoveryProductionBootActivation.js
      - run: node --check scripts/verify-movie-mentor-journey-recovery-production-boot-activation.mjs
      - run: node scripts/verify-movie-mentor-journey-recovery-production-boot-activation.mjs
