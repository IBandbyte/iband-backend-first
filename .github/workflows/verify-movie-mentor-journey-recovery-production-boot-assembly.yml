name: Verify Movie Mentor Journey Recovery Production Boot Assembly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check production boot assembly
        run: node --check ai/MovieMentorJourneyRecoveryProductionBootAssembly.js

      - name: Syntax check production boot assembly torture
        run: node --check scripts/verify-movie-mentor-journey-recovery-production-boot-assembly.mjs

      - name: Verify production boot assembly
        run: node scripts/verify-movie-mentor-journey-recovery-production-boot-assembly.mjs
