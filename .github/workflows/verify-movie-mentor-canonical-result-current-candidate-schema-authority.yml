name: Verify Movie Mentor Canonical Result Current Candidate Schema Authority

on:
  pull_request:
    paths:
      - "ai/MovieMentorCanonicalResultMongoStore.js"
      - "ai/MovieMentorResultCandidateMongoStore.js"
      - "scripts/verify-movie-mentor-canonical-result-current-candidate-schema-authority.mjs"
      - ".github/workflows/verify-movie-mentor-canonical-result-current-candidate-schema-authority.yml"
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorCanonicalResultMongoStore.js"
      - "ai/MovieMentorResultCandidateMongoStore.js"
      - "scripts/verify-movie-mentor-canonical-result-current-candidate-schema-authority.mjs"
      - ".github/workflows/verify-movie-mentor-canonical-result-current-candidate-schema-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check canonical result current candidate schema authority syntax
        run: |
          node --check ai/MovieMentorCanonicalResultMongoStore.js
          node --check ai/MovieMentorResultCandidateMongoStore.js
          node --check scripts/verify-movie-mentor-canonical-result-current-candidate-schema-authority.mjs
      - name: Verify canonical result current candidate schema authority
        run: node scripts/verify-movie-mentor-canonical-result-current-candidate-schema-authority.mjs
