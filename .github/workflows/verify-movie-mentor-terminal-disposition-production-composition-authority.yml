name: Verify Movie Mentor Terminal Disposition Production Composition Authority

on:
  pull_request:
  push:
    branches:
      - verify-terminal-disposition-production-composition-authority

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 21
      - run: node scripts/verify-movie-mentor-terminal-disposition-production-composition-authority.mjs
