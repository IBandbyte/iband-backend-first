name: Verify Movie Mentor Journey Recovery Clerk Credential Verifier

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check Clerk credential verifier
        run: node --check ai/MovieMentorJourneyRecoveryClerkCredentialVerifier.js

      - name: Syntax check Clerk verifier torture
        run: node --check scripts/verify-movie-mentor-journey-recovery-clerk-credential-verifier.mjs

      - name: Verify trusted Clerk credential verifier
        run: node scripts/verify-movie-mentor-journey-recovery-clerk-credential-verifier.mjs
