name: Verify Movie Mentor Continuity Cache Physical Authority
on:
  pull_request:
    branches: [main]
    paths:
      - "ai/MovieMentorContinuityDerivedCacheStore.js"
      - "ai/MovieMentorSpecialistExecutor.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "movieMentorTurn.js"
      - "scripts/verify-movie-mentor-continuity-cache-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-continuity-cache-physical-authority.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify continuity cache physical authority
        run: node scripts/verify-movie-mentor-continuity-cache-physical-authority.mjs
