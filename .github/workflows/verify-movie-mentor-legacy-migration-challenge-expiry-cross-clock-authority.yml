name: Verify Movie Mentor Legacy Migration Challenge Expiry Cross Clock Authority
on:
  pull_request:
    paths:
      - "ai/MovieMentorLegacyMigrationChallengeAuthority.js"
      - "ai/MovieMentorLegacyMigrationChallengeStore.js"
      - "scripts/verify-movie-mentor-legacy-migration-challenge-expiry-cross-clock-authority.mjs"
      - ".github/workflows/verify-movie-mentor-legacy-migration-challenge-expiry-cross-clock-authority.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-legacy-migration-challenge-expiry-cross-clock-authority.mjs
