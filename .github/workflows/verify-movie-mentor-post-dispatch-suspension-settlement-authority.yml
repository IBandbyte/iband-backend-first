name: Verify Movie Mentor Post Dispatch Suspension Settlement Authority
on:
  push:
    branches:
      - verify-post-dispatch-suspension-settlement-authority
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/iband_pr416?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Initialize Mongo replica set
        run: |
          mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}) }' mongodb://127.0.0.1:27017/admin
          for i in {1..30}; do
            mongosh --quiet --eval 'if (db.hello().isWritablePrimary) quit(0); quit(1)' mongodb://127.0.0.1:27017/admin && break
            sleep 1
          done
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify post-dispatch suspension settlement authority
        run: node scripts/verify-movie-mentor-post-dispatch-suspension-settlement-authority.mjs
      - name: Regress settled execution authority
        run: node scripts/verify-movie-mentor-settled-execution-authority.mjs
      - name: Regress revoked reality authority
        run: node scripts/verify-movie-mentor-revoked-reality-authority.mjs
      - name: Regress post-settlement reality race
        run: node scripts/verify-movie-mentor-post-settlement-reality-race.mjs
