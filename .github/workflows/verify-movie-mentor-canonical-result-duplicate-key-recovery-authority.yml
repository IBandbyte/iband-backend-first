name: Verify Movie Mentor Canonical Result Duplicate Key Recovery Authority

on:
  pull_request:
    paths:
      - 'ai/MovieMentorCanonicalResultMongoStore.js'
      - 'scripts/verify-movie-mentor-canonical-result-duplicate-key-recovery-authority.mjs'
      - '.github/workflows/verify-movie-mentor-canonical-result-duplicate-key-recovery-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify canonical result duplicate-key recovery authority
        run: node scripts/verify-movie-mentor-canonical-result-duplicate-key-recovery-authority.mjs
