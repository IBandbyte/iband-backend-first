name: Verify Movie Mentor Inference Execution Index Provisioning Authority
on:
  push:
    paths:
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "scripts/verify-movie-mentor-inference-execution-index-provisioning-authority.mjs"
      - ".github/workflows/verify-movie-mentor-inference-execution-index-provisioning-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "scripts/verify-movie-mentor-inference-execution-index-provisioning-authority.mjs"
      - ".github/workflows/verify-movie-mentor-inference-execution-index-provisioning-authority.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: node --check ai/MovieMentorInferenceExecutionMongoStore.js
      - run: node scripts/verify-movie-mentor-inference-execution-index-provisioning-authority.mjs
