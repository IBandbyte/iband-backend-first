name: Verify Movie Mentor Slow Clock Lease Renewal Authority

on:
  push:
    paths:
      - "scripts/verify-movie-mentor-slow-clock-lease-renewal-authority.mjs"
      - ".github/workflows/verify-movie-mentor-slow-clock-lease-renewal-authority.yml"
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
  pull_request:
    paths:
      - "scripts/verify-movie-mentor-slow-clock-lease-renewal-authority.mjs"
      - ".github/workflows/verify-movie-mentor-slow-clock-lease-renewal-authority.yml"
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/iband_movie_mentor_slow_clock_lease_renewal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check scripts/verify-movie-mentor-slow-clock-lease-renewal-authority.mjs
      - run: node scripts/verify-movie-mentor-slow-clock-lease-renewal-authority.mjs
