name: Verify Movie Mentor Creator State Uncoordinated HTTP
on:
  push:
    branches:
      - verify/creator-state-sync-provenance-court-20261103
  workflow_dispatch:
jobs:
  creator-state-http-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test dependencies
        run: npm install --no-audit --no-fund
      - name: Execute isolated HTTP ingress physical court
        run: node scripts/verify-movie-mentor-creator-state-uncoordinated-http-court.mjs
