name: Verify Movie Mentor Execution Replace CAS Owner
on:
  push:
    branches: [verify-execution-replace-cas-owner]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-execution-replace-cas-owner.mjs
