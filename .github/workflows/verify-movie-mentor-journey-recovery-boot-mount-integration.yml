name: Verify Movie Mentor Journey Recovery Boot Mount Integration

on:
  push:
    paths:
      - "server.js"
      - "ai/MovieMentorJourneyRecoveryBootMountIntegration.js"
      - "ai/MovieMentorJourneyRecoveryRouteMountDependencyGate.js"
      - "ai/MovieMentorJourneyRecoveryExpressRouterFactory.js"
      - "ai/MovieMentorJourneyRecoveryHttpTransportAdapter.js"
      - "ai/MovieMentorJourneyRecoveryPublicationBoundary.js"
      - "ai/MovieMentorJourneyRecoveryRequestAuthority.js"
      - "ai/MovieMentorDeterministicPrincipalAdapter.js"
      - "ai/MovieMentorJourneyRecoveryAuthorizationBoundary.js"
      - "ai/MovieMentorProjectOwnershipRegistry.js"
      - "ai/MovieMentorJourneyRecoveryEnvelope.js"
      - "ai/MovieMentorJourneyRecoveryTransition.js"
      - "ai/MovieMentorJourneyRecoveryStore.js"
      - "scripts/verify-movie-mentor-journey-recovery-boot-mount-integration.mjs"
      - ".github/workflows/verify-movie-mentor-journey-recovery-boot-mount-integration.yml"
  pull_request:
    paths:
      - "server.js"
      - "ai/MovieMentorJourneyRecoveryBootMountIntegration.js"
      - "ai/MovieMentorJourneyRecoveryRouteMountDependencyGate.js"
      - "ai/MovieMentorJourneyRecoveryExpressRouterFactory.js"
      - "ai/MovieMentorJourneyRecoveryHttpTransportAdapter.js"
      - "ai/MovieMentorJourneyRecoveryPublicationBoundary.js"
      - "ai/MovieMentorJourneyRecoveryRequestAuthority.js"
      - "ai/MovieMentorDeterministicPrincipalAdapter.js"
      - "ai/MovieMentorJourneyRecoveryAuthorizationBoundary.js"
      - "ai/MovieMentorProjectOwnershipRegistry.js"
      - "ai/MovieMentorJourneyRecoveryEnvelope.js"
      - "ai/MovieMentorJourneyRecoveryTransition.js"
      - "ai/MovieMentorJourneyRecoveryStore.js"
      - "scripts/verify-movie-mentor-journey-recovery-boot-mount-integration.mjs"
      - ".github/workflows/verify-movie-mentor-journey-recovery-boot-mount-integration.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Syntax check boot integration
        run: node --check ai/MovieMentorJourneyRecoveryBootMountIntegration.js

      - name: Syntax check server boot wiring
        run: node --check server.js

      - name: Run boot mount integration torture
        run: node scripts/verify-movie-mentor-journey-recovery-boot-mount-integration.mjs
