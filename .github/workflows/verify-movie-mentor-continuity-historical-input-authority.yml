name: Verify Movie Mentor Continuity Historical Input Authority

on:
  pull_request:
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/MovieMentorSpecialistExecutor.js"
      - "ai/MovieMentorContinuityAgent.js"
      - "ai/MovieMentorProviderOperationAuthority.js"
      - "ai/MovieMentorProviderOperationMongoStore.js"
      - "scripts/verify-movie-mentor-continuity-historical-input-authority.mjs"
      - ".github/workflows/verify-movie-mentor-continuity-historical-input-authority.yml"
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/MovieMentorSpecialistExecutor.js"
      - "ai/MovieMentorContinuityAgent.js"
      - "ai/MovieMentorProviderOperationAuthority.js"
      - "ai/MovieMentorProviderOperationMongoStore.js"
      - "scripts/verify-movie-mentor-continuity-historical-input-authority.mjs"
      - ".github/workflows/verify-movie-mentor-continuity-historical-input-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check Continuity historical-input authority syntax
        run: |
          node --check ai/MovieMentorTurnRuntime.js
          node --check ai/MovieMentorSpecialistExecutor.js
          node --check ai/MovieMentorContinuityAgent.js
          node --check ai/MovieMentorProviderOperationAuthority.js
          node --check ai/MovieMentorProviderOperationMongoStore.js
          node --check scripts/verify-movie-mentor-continuity-historical-input-authority.mjs
      - name: Verify Continuity historical-input authority
        run: node scripts/verify-movie-mentor-continuity-historical-input-authority.mjs
