name: Verify Movie Mentor Provider Call Return Binding Authority
on:
  push:
    branches: [verify-provider-call-return-binding-authority]
  pull_request:
    paths: ["ai/MovieMentorTurnRuntime.js","scripts/verify-movie-mentor-provider-call-return-binding-authority.mjs",".github/workflows/verify-movie-mentor-provider-call-return-binding-authority.yml"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: node --check scripts/verify-movie-mentor-provider-call-return-binding-authority.mjs
      - run: node scripts/verify-movie-mentor-provider-call-return-binding-authority.mjs
