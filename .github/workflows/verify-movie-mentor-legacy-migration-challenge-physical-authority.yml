name: Verify Movie Mentor Legacy Migration Challenge Physical Authority

on:
  push:
    paths:
      - "ai/MovieMentorLegacyMigrationChallengeStore.js"
      - "ai/MovieMentorLegacyMigrationCeremony.js"
      - "scripts/verify-movie-mentor-legacy-migration-challenge-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-legacy-migration-challenge-physical-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorLegacyMigrationChallengeStore.js"
      - "ai/MovieMentorLegacyMigrationCeremony.js"
      - "scripts/verify-movie-mentor-legacy-migration-challenge-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-legacy-migration-challenge-physical-authority.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify challenge physical authority
        run: node scripts/verify-movie-mentor-legacy-migration-challenge-physical-authority.mjs
