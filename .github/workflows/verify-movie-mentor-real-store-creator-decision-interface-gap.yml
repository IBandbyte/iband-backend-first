name: Verify Movie Mentor Real Store Creator Decision Interface Gap
on:
  workflow_dispatch:
  push:
    branches:
      - audit/creator-first-commit-takeover-verifier
    paths:
      - scripts/verify-movie-mentor-real-store-creator-decision-interface-gap.mjs
      - .github/workflows/verify-movie-mentor-real-store-creator-decision-interface-gap.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check scripts/verify-movie-mentor-real-store-creator-decision-interface-gap.mjs
      - run: node scripts/verify-movie-mentor-real-store-creator-decision-interface-gap.mjs
