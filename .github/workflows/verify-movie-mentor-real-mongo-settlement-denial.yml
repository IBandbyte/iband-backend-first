name: Verify Movie Mentor Real Mongo Settlement Denial
on:
  push:
    branches:
      - verify/settlement-mongo-denial-court-20261105
  workflow_dispatch:
jobs:
  real-mongo-settlement-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Start disposable Mongo replica set
        run: |
          docker run -d --name movie-mentor-settlement-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec movie-mentor-settlement-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec movie-mentor-settlement-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 40); do
            if docker exec movie-mentor-settlement-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then break; fi
            sleep 2
          done
      - name: Verify physical settlement denial and durable non-mutation
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_settlement_denial?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-real-mongo-settlement-denial.mjs
