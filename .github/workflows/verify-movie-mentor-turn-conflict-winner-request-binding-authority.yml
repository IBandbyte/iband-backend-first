name: Verify Movie Mentor Turn Conflict Winner Request Binding Authority
on:
  push:
    branches: [verify-turn-conflict-winner-request-binding-authority]
  pull_request:
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "scripts/verify-movie-mentor-turn-conflict-winner-request-binding-authority.mjs"
      - ".github/workflows/verify-movie-mentor-turn-conflict-winner-request-binding-authority.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check scripts/verify-movie-mentor-turn-conflict-winner-request-binding-authority.mjs
      - run: node scripts/verify-movie-mentor-turn-conflict-winner-request-binding-authority.mjs
