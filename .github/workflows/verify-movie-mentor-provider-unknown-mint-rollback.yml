name: Verify Movie Mentor Provider UNKNOWN Mint Rollback

on:
  pull_request:
    paths:
      - "ai/MovieMentorProviderEffectMongoStore.js"
      - "scripts/verify-movie-mentor-provider-unknown-mint-rollback.mjs"
      - ".github/workflows/verify-movie-mentor-provider-unknown-mint-rollback.yml"
  workflow_dispatch:

jobs:
  verify-provider-unknown-mint-rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify provider UNKNOWN mint rollback
        run: node scripts/verify-movie-mentor-provider-unknown-mint-rollback.mjs
