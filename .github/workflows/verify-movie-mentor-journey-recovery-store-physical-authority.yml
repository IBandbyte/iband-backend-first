name: Verify Movie Mentor Journey Recovery Store Physical Authority

on:
  push:
    paths:
      - "ai/MovieMentorJourneyRecoveryStore.js"
      - "scripts/verify-movie-mentor-journey-recovery-store-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-journey-recovery-store-physical-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorJourneyRecoveryStore.js"
      - "scripts/verify-movie-mentor-journey-recovery-store-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-journey-recovery-store-physical-authority.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/verify-movie-mentor-journey-recovery-store-physical-authority.mjs
      - run: node scripts/verify-movie-mentor-journey-recovery-store-physical-authority.mjs
