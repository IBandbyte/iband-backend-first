name: Verify Movie Mentor Inference Spend Index Readiness

on:
  pull_request:
    paths:
      - "ai/MovieMentorInferenceSpendMongoStore.js"
      - "ai/MovieMentorProductionInferenceSpendComposition.js"
      - "scripts/verify-movie-mentor-inference-spend-index-readiness.mjs"
      - ".github/workflows/verify-movie-mentor-inference-spend-index-readiness.yml"

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check scripts/verify-movie-mentor-inference-spend-index-readiness.mjs
      - run: node scripts/verify-movie-mentor-inference-spend-index-readiness.mjs
