name: Verify Movie Mentor Recovered Provider Decision Identity Authority
on:
  push:
    paths: ["ai/MovieMentorRecoveredProviderResultAuthority.js","scripts/verify-movie-mentor-recovered-provider-decision-identity-authority.mjs",".github/workflows/verify-movie-mentor-recovered-provider-decision-identity-authority.yml"]
  pull_request:
    paths: ["ai/MovieMentorRecoveredProviderResultAuthority.js","scripts/verify-movie-mentor-recovered-provider-decision-identity-authority.mjs",".github/workflows/verify-movie-mentor-recovered-provider-decision-identity-authority.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-recovered-provider-decision-identity-authority.mjs
