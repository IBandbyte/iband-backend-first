name: Verify Movie Mentor AUD-OPEN-01 Case D Signed Stripe Boundary
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-movie-mentor-aud-open-01-case-d-signed-stripe-boundary.mjs
