name: Verify Movie Mentor Journey Recovery Activation Lease Authority

on:
  push:
    paths:
      - "ai/MovieMentorJourneyRecoveryActivationLeaseAuthority.js"
      - "scripts/verify-movie-mentor-journey-recovery-activation-lease-authority.mjs"
      - ".github/workflows/verify-movie-mentor-journey-recovery-activation-lease-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorJourneyRecoveryActivationLeaseAuthority.js"
      - "scripts/verify-movie-mentor-journey-recovery-activation-lease-authority.mjs"
      - ".github/workflows/verify-movie-mentor-journey-recovery-activation-lease-authority.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check ai/MovieMentorJourneyRecoveryActivationLeaseAuthority.js
      - run: node --check scripts/verify-movie-mentor-journey-recovery-activation-lease-authority.mjs
      - run: node scripts/verify-movie-mentor-journey-recovery-activation-lease-authority.mjs
