name: Verify Movie Mentor Early Terminal Replay State Authority
on:
  push:
    branches: [verify-early-terminal-replay-state-authority]
  pull_request:
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-early-terminal-replay-state-authority.mjs"
      - ".github/workflows/verify-movie-mentor-early-terminal-replay-state-authority.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node --check scripts/verify-movie-mentor-early-terminal-replay-state-authority.mjs
      - run: node scripts/verify-movie-mentor-early-terminal-replay-state-authority.mjs
