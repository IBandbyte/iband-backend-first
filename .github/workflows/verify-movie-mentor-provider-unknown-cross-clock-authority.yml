name: Verify Movie Mentor Provider UNKNOWN Cross Clock Authority
on:
  push:
    paths:
      - "ai/MovieMentorProviderEffectMongoStore.js"
      - "scripts/verify-movie-mentor-provider-unknown-cross-clock-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-unknown-cross-clock-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorProviderEffectMongoStore.js"
      - "scripts/verify-movie-mentor-provider-unknown-cross-clock-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-unknown-cross-clock-authority.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://localhost:27017/iband_movie_mentor_unknown_clock?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          until docker exec mongo-rs mongosh --quiet --eval "db.runCommand({ping:1}).ok" >/dev/null 2>&1; do sleep 1; done
          docker exec mongo-rs mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          until docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done
      - run: node scripts/verify-movie-mentor-provider-unknown-cross-clock-authority.mjs
