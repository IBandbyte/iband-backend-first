name: Verify Movie Mentor Checkout Binding Physical Authority

on:
  push:
    paths:
      - "ai/MovieMentorCommercialCheckoutBindingMongoStore.js"
      - "ai/MovieMentorProductionCommercialCheckoutComposition.js"
      - "ai/MovieMentorProductionCommercialHttpIngress.js"
      - "server.js"
      - "scripts/verify-movie-mentor-checkout-binding-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-checkout-binding-physical-authority.yml"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "ai/MovieMentorCommercialCheckoutBindingMongoStore.js"
      - "ai/MovieMentorProductionCommercialCheckoutComposition.js"
      - "ai/MovieMentorProductionCommercialHttpIngress.js"
      - "server.js"
      - "scripts/verify-movie-mentor-checkout-binding-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-checkout-binding-physical-authority.yml"
      - ".github/workflows/ci-backend.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check ai/MovieMentorCommercialCheckoutBindingMongoStore.js
      - run: node --check scripts/verify-movie-mentor-checkout-binding-physical-authority.mjs
      - run: node scripts/verify-movie-mentor-checkout-binding-physical-authority.mjs
