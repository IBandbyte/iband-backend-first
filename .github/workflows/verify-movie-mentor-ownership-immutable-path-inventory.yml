name: Verify Movie Mentor Ownership Immutable Path Inventory
on:
  workflow_dispatch:
  push:
    branches:
      - verify/creator-atomic-production-mount-court-20261104
    paths:
      - ".github/workflows/verify-movie-mentor-ownership-immutable-path-inventory.yml"
      - "scripts/verify-movie-mentor-ownership-immutable-path-inventory.mjs"
      - "ai/MovieMentorProjectOwnershipRegistry.js"
      - "ai/MovieMentorCreatorStateAtomicComposition.js"
      - "ai/MovieMentorCreatorStateAtomicReadiness.js"
jobs:
  immutable-path-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/verify-movie-mentor-ownership-immutable-path-inventory.mjs
