name: Verify Movie Mentor Project Ownership Registry

on:
  push:
    paths:
      - "ai/MovieMentorProjectOwnershipRegistry.js"
      - "scripts/verify-movie-mentor-project-ownership-registry.mjs"
      - ".github/workflows/verify-movie-mentor-project-ownership-registry.yml"
  pull_request:
    paths:
      - "ai/MovieMentorProjectOwnershipRegistry.js"
      - "scripts/verify-movie-mentor-project-ownership-registry.mjs"
      - ".github/workflows/verify-movie-mentor-project-ownership-registry.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check ownership registry syntax
        run: node --check ai/MovieMentorProjectOwnershipRegistry.js
      - name: Torture Movie Mentor project ownership registry
        run: node scripts/verify-movie-mentor-project-ownership-registry.mjs
