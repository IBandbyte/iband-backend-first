name: Verify Movie Mentor Commercial Reversal Identity Rollback

on:
  pull_request:
    paths:
      - "ai/MovieMentorCommercialReversalMongoStore.js"
      - "scripts/verify-movie-mentor-commercial-reversal-id-rollback.mjs"
      - ".github/workflows/verify-movie-mentor-commercial-reversal-id-rollback.yml"
  workflow_dispatch:

jobs:
  verify-commercial-reversal-id-rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify commercial reversal identity rollback
        run: node scripts/verify-movie-mentor-commercial-reversal-id-rollback.mjs
