name: Verify Movie Mentor Proof Time Authority
on:
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorInferenceExecutionClosureAuthority.js"
      - "ai/MovieMentorInferenceSpendMongoStore.js"
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "ai/MovieMentorProviderEffectMongoStore.js"
      - "ai/MovieMentorInferenceSettlementMongoStore.js"
      - "ai/MovieMentorResultCandidateMongoStore.js"
      - "ai/MovieMentorCanonicalResultMongoStore.js"
      - "scripts/verify-movie-mentor-proof-time-authority.mjs"
      - ".github/workflows/verify-movie-mentor-proof-time-authority.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check proof-time authority syntax
        run: |
          node --check ai/MovieMentorInferenceExecutionClosureAuthority.js
          node --check ai/MovieMentorInferenceSpendMongoStore.js
          node --check ai/MovieMentorInferenceExecutionMongoStore.js
          node --check ai/MovieMentorProviderEffectMongoStore.js
          node --check ai/MovieMentorInferenceSettlementMongoStore.js
          node --check ai/MovieMentorResultCandidateMongoStore.js
          node --check ai/MovieMentorCanonicalResultMongoStore.js
          node --check scripts/verify-movie-mentor-proof-time-authority.mjs
      - name: Verify durable proof-time authority
        run: node scripts/verify-movie-mentor-proof-time-authority.mjs
      - name: Regress creator spend reservation authority
        run: node scripts/verify-movie-mentor-inference-spend-authority.mjs
      - name: Regress economic settlement capability boundary
        run: node scripts/verify-movie-mentor-inference-spend-settlement-authority.mjs
      - name: Regress staged result recovery
        run: node scripts/verify-movie-mentor-result-candidate-recovery.mjs
      - name: Regress settled execution authority
        run: node scripts/verify-movie-mentor-settled-execution-authority.mjs
      - name: Regress deterministic settlement reconciliation
        run: node scripts/verify-movie-mentor-inference-settlement-reconciliation.mjs
