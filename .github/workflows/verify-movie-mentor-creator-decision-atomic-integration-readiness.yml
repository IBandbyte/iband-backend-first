name: Verify Movie Mentor Creator Decision Atomic Integration Readiness
on:
  push:
    branches: [audit/creator-first-commit-takeover-verifier]
    paths:
      - scripts/verify-movie-mentor-creator-decision-atomic-integration-readiness.mjs
      - .github/workflows/verify-movie-mentor-creator-decision-atomic-integration-readiness.yml
  workflow_dispatch:
jobs:
  integration-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/verify-movie-mentor-creator-decision-atomic-integration-readiness.mjs
      - run: node scripts/verify-movie-mentor-creator-decision-atomic-integration-readiness.mjs
