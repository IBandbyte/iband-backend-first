name: Audit Movie Mentor creator HTTP credential denial
on:
  push:
    branches:
      - audit/creator-http-revocation-ingress-20261107
  workflow_dispatch:
jobs:
  isolated-http-denial:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm exact head and original postcheck preserved
        run: |
          echo "AUDIT_SHA=$(git rev-parse HEAD)"
          git cat-file -e d86fc6e2aa4bce0245f540fd62e3dc9b01f721a9:scripts/verify-movie-mentor-creator-state-mongo-postcheck-revocation.mjs
          test "$(git show d86fc6e2aa4bce0245f540fd62e3dc9b01f721a9:scripts/verify-movie-mentor-creator-state-mongo-postcheck-revocation.mjs | sha256sum | cut -d' ' -f1)" = "$(sha256sum scripts/verify-movie-mentor-creator-state-mongo-postcheck-revocation.mjs | cut -d' ' -f1)"
      - name: Install isolated verifier dependencies (repository has no npm lockfile)
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Start disposable MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0
      - name: Physical HTTP and MongoDB revocation court
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_http_mongo_revocation?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-creator-http-mongo-revocation.mjs
      - name: Real state transition HTTP Mongo court
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_real_transition_http?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-real-transition-http-mongo.mjs
      - name: Real Clerk verifier and durable Mongo ownership court
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_clerk_ownership?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-real-clerk-durable-ownership.mjs
      - name: Physical loopback HTTP credential-denial court
        run: node scripts/verify-movie-mentor-creator-http-revocation-ingress.mjs
