name: Verify Movie Mentor Continuation History Provenance Authority
on:
  pull_request:
    branches: [main]
    paths:
      - "ai/MovieMentorCreatorStateTransition.js"
      - "ai/MovieMentorContinuationReferenceControl.js"
      - "ai/MovieMentorCreatorDecisionAuthority.js"
      - "movieMentorTurn.js"
      - "scripts/verify-movie-mentor-continuation-history-provenance-authority.mjs"
      - ".github/workflows/verify-movie-mentor-continuation-history-provenance-authority.yml"
  push:
    branches: ["verify-continuation-history-provenance-authority"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check scripts/verify-movie-mentor-continuation-history-provenance-authority.mjs
      - run: node scripts/verify-movie-mentor-continuation-history-provenance-authority.mjs
