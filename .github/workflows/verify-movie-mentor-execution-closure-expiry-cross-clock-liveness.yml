name: Verify Movie Mentor Execution Closure Expiry Cross Clock Liveness

on:
  push:
    paths:
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "scripts/verify-movie-mentor-execution-closure-expiry-cross-clock-liveness.mjs"
      - ".github/workflows/verify-movie-mentor-execution-closure-expiry-cross-clock-liveness.yml"
  pull_request:
    paths:
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "scripts/verify-movie-mentor-execution-closure-expiry-cross-clock-liveness.mjs"
      - ".github/workflows/verify-movie-mentor-execution-closure-expiry-cross-clock-liveness.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/iband_execution_closure_cross_clock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-execution-closure-expiry-cross-clock-liveness.mjs
