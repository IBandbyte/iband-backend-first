name: Verify Movie Mentor Creator State Consumption Authority

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "movieMentorTurn.js"
      - "ai/MovieMentorCreatorStateConsumptionAuthority.js"
      - "ai/MovieMentorCreatorStateConsumptionRuntime.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-creator-state-consumption-authority.mjs"
      - ".github/workflows/verify-movie-mentor-creator-state-consumption-authority.yml"
  push:
    branches:
      - main
    paths:
      - "movieMentorTurn.js"
      - "ai/MovieMentorCreatorStateConsumptionAuthority.js"
      - "ai/MovieMentorCreatorStateConsumptionRuntime.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-creator-state-consumption-authority.mjs"
      - ".github/workflows/verify-movie-mentor-creator-state-consumption-authority.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check creator-state consumption authority syntax
        run: |
          node --check ai/MovieMentorCreatorStateConsumptionAuthority.js
          node --check ai/MovieMentorCreatorStateConsumptionRuntime.js
          node --check movieMentorTurn.js
          node --check scripts/verify-movie-mentor-creator-state-consumption-authority.mjs
      - name: ROUND SEVEN creator-state consumption authority torture
        run: node scripts/verify-movie-mentor-creator-state-consumption-authority.mjs
