name: Verify Movie Mentor Ownership Contract Reconciliation
on:
  push:
    branches:
      - verify/creator-state-contract-reconciliation-20261107
  workflow_dispatch:
jobs:
  ownership-contract-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated dependencies
        run: npm install --ignore-scripts
      - name: Assert original RED verifier unchanged
        run: |
          git diff --exit-code 377538c4b34da54b2ef971e407385f71f4a61abe HEAD -- scripts/verify-movie-mentor-creator-state-mongo-postcheck-revocation.mjs
      - name: Start disposable Mongo replica set
        run: |
          docker run -d --name movie-mentor-contract-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec movie-mentor-contract-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec movie-mentor-contract-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 40); do
            if docker exec movie-mentor-contract-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then break; fi
            sleep 2
          done
      - name: Physical local-flag post-fence characterization
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/contract_local_flag?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-creator-state-postfence-local-flag.mjs
      - name: Physical durable revision denial and rollback
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/contract_durable_revision?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-creator-state-durable-revision-contention.mjs
      - name: Physical post-fence contention and atomicity
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/contract_postfence_overlap?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-creator-state-postfence-physical-overlap.mjs
