name: Verify Movie Mentor New Entitlement Receipt Rollback

on:
  pull_request:
    paths:
      - "ai/MovieMentorEntitlementIssuanceMongoStore.js"
      - "scripts/verify-movie-mentor-entitlement-new-create-receipt-rollback.mjs"
      - ".github/workflows/verify-movie-mentor-entitlement-new-create-receipt-rollback.yml"
  workflow_dispatch:

jobs:
  verify-new-entitlement-receipt-rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify new entitlement receipt rollback
        run: node scripts/verify-movie-mentor-entitlement-new-create-receipt-rollback.mjs
