name: Verify Movie Mentor Live Closure Authority Ahead Clock Delegation
on:
  push:
    paths:
      - "ai/MovieMentorInferenceExecutionClosureAuthority.js"
      - "scripts/verify-movie-mentor-live-closure-authority-ahead-clock-delegation.mjs"
      - ".github/workflows/verify-movie-mentor-live-closure-authority-ahead-clock-delegation.yml"
  pull_request:
    paths:
      - "ai/MovieMentorInferenceExecutionClosureAuthority.js"
      - "scripts/verify-movie-mentor-live-closure-authority-ahead-clock-delegation.mjs"
      - ".github/workflows/verify-movie-mentor-live-closure-authority-ahead-clock-delegation.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-live-closure-authority-ahead-clock-delegation.mjs
