name: Verify Movie Mentor Existing Execution Acquisition Binding Authority
on:
  push:
    branches: [verify-existing-execution-acquisition-binding-authority]
  pull_request:
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-existing-execution-acquisition-binding-authority.mjs"
      - ".github/workflows/verify-movie-mentor-existing-execution-acquisition-binding-authority.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/verify-movie-mentor-existing-execution-acquisition-binding-authority.mjs
      - run: node scripts/verify-movie-mentor-existing-execution-acquisition-binding-authority.mjs
