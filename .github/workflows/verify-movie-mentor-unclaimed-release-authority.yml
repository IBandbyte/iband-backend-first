name: Verify Movie Mentor Atomic Unclaimed Release Authority
on:
  push:
    branches: [main]
    paths:
      - 'ai/MovieMentorInferenceExecutionMongoStore.js'
      - 'ai/MovieMentorInferenceSettlementMongoStore.js'
      - 'ai/MovieMentorInferenceSettlementReconciliationAuthority.js'
      - 'ai/MovieMentorTurnRuntime.js'
      - 'movieMentorTurn.js'
      - 'server.js'
      - 'scripts/verify-movie-mentor-unclaimed-release-authority.mjs'
      - '.github/workflows/verify-movie-mentor-unclaimed-release-authority.yml'
  pull_request:
    paths:
      - 'ai/MovieMentorInferenceExecutionMongoStore.js'
      - 'ai/MovieMentorInferenceSettlementMongoStore.js'
      - 'ai/MovieMentorInferenceSettlementReconciliationAuthority.js'
      - 'ai/MovieMentorTurnRuntime.js'
      - 'movieMentorTurn.js'
      - 'server.js'
      - 'scripts/verify-movie-mentor-unclaimed-release-authority.mjs'
      - '.github/workflows/verify-movie-mentor-unclaimed-release-authority.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-unclaimed-release-authority.mjs
