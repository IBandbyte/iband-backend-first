name: Verify Movie Mentor Result Candidate Creator Compensation Race Authority

on:
  push:
    branches:
      - verify-result-candidate-creator-compensation-race
  pull_request:
    branches:
      - verify-provider-dispatch-post-proof-creator-state-race
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/verify-movie-mentor-result-candidate-creator-compensation-race-authority.mjs
