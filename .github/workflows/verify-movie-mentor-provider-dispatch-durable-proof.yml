name: Verify Movie Mentor Gates of Execution Provider Dispatch Durable Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "scripts/verify-movie-mentor-provider-dispatch-durable-proof.mjs"
      - ".github/workflows/verify-movie-mentor-provider-dispatch-durable-proof.yml"

jobs:
  verify-provider-dispatch-durable-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check execution authority syntax
        run: node --check ai/MovieMentorInferenceExecutionLeaseAuthority.js

      - name: Check provider dispatch gate syntax
        run: node --check scripts/verify-movie-mentor-provider-dispatch-durable-proof.mjs

      - name: Verify provider dispatch durable proof
        run: node scripts/verify-movie-mentor-provider-dispatch-durable-proof.mjs
