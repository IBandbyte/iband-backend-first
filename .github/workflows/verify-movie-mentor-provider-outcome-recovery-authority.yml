name: Verify Movie Mentor Provider Outcome Recovery Authority

on:
  pull_request:
    paths:
      - "ai/MovieMentorProviderOutcomeRecoveryAuthority.js"
      - "ai/MovieMentorProviderOperationAuthority.js"
      - "ai/MovieMentorProviderEffectAuthority.js"
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "ai/StructuredAIProviderClient.js"
      - "scripts/verify-movie-mentor-provider-outcome-recovery-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-outcome-recovery-authority.yml"
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorProviderOutcomeRecoveryAuthority.js"
      - "ai/MovieMentorProviderOperationAuthority.js"
      - "ai/MovieMentorProviderEffectAuthority.js"
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "ai/StructuredAIProviderClient.js"
      - "scripts/verify-movie-mentor-provider-outcome-recovery-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-outcome-recovery-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check provider outcome recovery authority syntax
        run: |
          node --check ai/MovieMentorProviderOperationAuthority.js
          node --check ai/MovieMentorProviderEffectAuthority.js
          node --check ai/MovieMentorInferenceExecutionLeaseAuthority.js
          node --check ai/MovieMentorProductionInferenceExecutionComposition.js
          node --check ai/StructuredAIProviderClient.js
          node --check scripts/verify-movie-mentor-provider-outcome-recovery-authority.mjs
          if [ -f ai/MovieMentorProviderOutcomeRecoveryAuthority.js ]; then node --check ai/MovieMentorProviderOutcomeRecoveryAuthority.js; fi
      - name: Verify provider outcome recovery authority
        run: node scripts/verify-movie-mentor-provider-outcome-recovery-authority.mjs
