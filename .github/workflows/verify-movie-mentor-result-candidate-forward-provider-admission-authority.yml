name: Verify Movie Mentor Result Candidate Forward Provider Admission Authority

on:
  push:
    branches:
      - verify-result-candidate-forward-provider-admission-authority
  pull_request:
    paths:
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "ai/MovieMentorResultCandidateMongoStore.js"
      - "scripts/verify-movie-mentor-result-candidate-forward-provider-admission-authority.mjs"
      - ".github/workflows/verify-movie-mentor-result-candidate-forward-provider-admission-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify result-candidate forward provider admission authority
        run: node scripts/verify-movie-mentor-result-candidate-forward-provider-admission-authority.mjs
