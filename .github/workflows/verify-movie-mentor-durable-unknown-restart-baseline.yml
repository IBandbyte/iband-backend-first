name: Verify Movie Mentor Durable UNKNOWN Restart Baseline
on:
  push:
    branches:
      - verify/http-interruption-recovery-20261110
  workflow_dispatch:
jobs:
  durable-unknown-restart-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_interruption_recovery?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated dependencies without writing lockfile
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Start disposable loopback Mongo replica set
        run: |
          docker run -d --name movie-mentor-interruption-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec movie-mentor-interruption-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec movie-mentor-interruption-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 40); do
            if docker exec movie-mentor-interruption-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "Isolated Mongo replica set did not become PRIMARY" >&2
          exit 1
      - name: Bootstrap required physical execution and settlement indexes in disposable Mongo
        run: |
          node --input-type=module <<'EOF'
          import mongoose from "mongoose";
          import {MOVIE_MENTOR_INFERENCE_EXECUTION_REQUIRED_UNIQUE_INDEXES as execution} from "./ai/MovieMentorInferenceExecutionPhysicalAuthority.js";
          import {MOVIE_MENTOR_INFERENCE_SETTLEMENT_REQUIRED_UNIQUE_INDEXES as settlement} from "./ai/MovieMentorInferenceSettlementPhysicalAuthority.js";
          const uri=process.env.MOVIE_MENTOR_ISOLATED_MONGO_URI;
          if(!/^mongodb:\/\/127\.0\.0\.1:27017\/movie_mentor_interruption_recovery\?/.test(uri||""))throw new Error("Refusing non-disposable Mongo target");
          await mongoose.connect(uri,{autoIndex:false});
          try {
            const requirements=new Map([...execution,...settlement].map(r=>[r.collection+":"+JSON.stringify(r.key),r]));
            for(const r of requirements.values())await mongoose.connection.db.collection(r.collection).createIndex(r.key,{unique:true});
            for(const r of requirements.values()){
              const indexes=await mongoose.connection.db.collection(r.collection).indexes();
              if(!indexes.some(i=>i.unique===true&&JSON.stringify(i.key)===JSON.stringify(r.key)))throw new Error("Missing physical unique index "+r.collection+" "+JSON.stringify(r.key));
            }
            const providerOperation=mongoose.connection.db.collection("movie_mentor_provider_operation_reality");
            await providerOperation.createIndex({providerCallId:1},{unique:true});
            const operationIndexes=await providerOperation.indexes();
            if(!operationIndexes.some(i=>i.unique===true&&JSON.stringify(i.key)===JSON.stringify({providerCallId:1})))throw new Error("Missing provider-operation physical unique index");
            const candidate=mongoose.connection.db.collection("movie_mentor_result_candidate");
            await candidate.createIndex({candidateReference:1},{unique:true});
            const candidateIndexes=await candidate.indexes();
            for(const key of [{executionId:1},{candidateReference:1}]){
              if(!candidateIndexes.some(i=>i.unique===true&&JSON.stringify(i.key)===JSON.stringify(key)))throw new Error("Missing result-candidate physical unique index "+JSON.stringify(key));
            }
            const canonical=mongoose.connection.db.collection("movie_mentor_canonical_result");
            const canonicalRequired=[{resultReference:1},{candidateReference:1},{executionId:1},{principalId:1,projectId:1,creatorTurnId:1},{reservationId:1}];
            for(const key of canonicalRequired)await canonical.createIndex(key,{unique:true});
            const canonicalIndexes=await canonical.indexes();
            for(const key of canonicalRequired){
              if(!canonicalIndexes.some(i=>i.unique===true&&JSON.stringify(i.key)===JSON.stringify(key)))throw new Error("Missing canonical-result physical unique index "+JSON.stringify(key));
            }
            console.log("GREEN isolated canonical-result physical unique indexes verified");
            console.log("GREEN isolated result-candidate physical unique indexes verified");
            console.log("GREEN isolated provider-operation physical unique index verified");
            console.log("GREEN isolated physical index bootstrap: "+requirements.size+" required unique indexes verified");
          }finally{await mongoose.disconnect();}
          EOF
      - name: Verify signed HTTP-origin provider SIGKILL and fresh-process UNKNOWN denial
        run: node scripts/verify-movie-mentor-http-origin-interruption-physical.mjs
      - name: Verify fresh-worker durable UNKNOWN fail-closed baseline
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_interruption_baseline?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-provider-durable-restart-unknown.mjs
      - name: Verify real provider socket SIGKILL and fresh-worker UNKNOWN denial
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_socket_baseline?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-physical-socket-interruption-baseline.mjs
