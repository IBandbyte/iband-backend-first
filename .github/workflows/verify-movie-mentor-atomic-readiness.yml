name: Verify Movie Mentor Atomic Readiness
on:
  push:
    branches:
      - verify/creator-state-sync-provenance-court-20261103
  workflow_dispatch:
jobs:
  atomic-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: node scripts/verify-movie-mentor-atomic-readiness.mjs
