name: Movie Mentor isolated UNKNOWN transaction preflight

on:
  push:
    branches:
      - audit-combined-socket-restart-unknown-8af140aa
  workflow_dispatch:

jobs:
  isolated-unknown-transaction-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_combined_preflight?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - name: Initialize isolated Mongo replica set
        run: |
          docker run -d --name movie-mentor-isolated-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec movie-mentor-isolated-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -qx '1'; then break; fi
            sleep 1
          done
          docker exec movie-mentor-isolated-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec movie-mentor-isolated-mongo mongosh --quiet --eval 'rs.status().myState' | grep -qx '1'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Physical UNKNOWN transaction preflight
        run: node scripts/verify-movie-mentor-combined-unknown-physical-preflight.mjs
