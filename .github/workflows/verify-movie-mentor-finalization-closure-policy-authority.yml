name: Verify Movie Mentor Finalization Closure Policy Authority
on:
  push:
    branches: [verify-finalization-closure-policy-authority]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: node scripts/verify-movie-mentor-finalization-closure-policy-authority.mjs
