name: Verify Movie Mentor Live Closure Entry Cross Clock Authority
on:
  push:
    paths:
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "scripts/verify-movie-mentor-live-closure-entry-cross-clock-authority.mjs"
      - ".github/workflows/verify-movie-mentor-live-closure-entry-cross-clock-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "scripts/verify-movie-mentor-live-closure-entry-cross-clock-authority.mjs"
      - ".github/workflows/verify-movie-mentor-live-closure-entry-cross-clock-authority.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' mongodb://localhost:27017/admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_URI: mongodb://localhost:27017/iband_movie_mentor_live_closure_clock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-live-closure-entry-cross-clock-authority.mjs
