name: Verify Movie Mentor Canonical Finalization Physical Authority

on:
  push:
    paths:
      - "ai/MovieMentorCanonicalResultMongoStore.js"
      - "ai/MovieMentorCanonicalResultAuthority.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "scripts/verify-movie-mentor-canonical-finalization-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-canonical-finalization-physical-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorCanonicalResultMongoStore.js"
      - "ai/MovieMentorCanonicalResultAuthority.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "scripts/verify-movie-mentor-canonical-finalization-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-canonical-finalization-physical-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-movie-mentor-canonical-finalization-physical-authority.mjs
