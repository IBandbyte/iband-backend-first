name: Verify Movie Mentor Canonical Finalization Barrier Race Authority

on:
  pull_request:
    paths:
      - "ai/MovieMentorCanonicalResultMongoStore.js"
      - "scripts/verify-movie-mentor-canonical-finalization-barrier-race-authority.mjs"
      - ".github/workflows/verify-movie-mentor-canonical-finalization-barrier-race-authority.yml"
  workflow_dispatch:

jobs:
  verify-canonical-finalization-barrier-race-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify canonical finalization barrier race authority
        run: node scripts/verify-movie-mentor-canonical-finalization-barrier-race-authority.mjs
