name: Verify Movie Mentor Inference Spend Reservation ID Collision Authority

on:
  pull_request:
    paths:
      - "ai/MovieMentorInferenceSpendMongoStore.js"
      - "scripts/verify-movie-mentor-inference-spend-reservation-id-collision-authority.mjs"
      - ".github/workflows/verify-movie-mentor-inference-spend-reservation-id-collision-authority.yml"
  workflow_dispatch:

jobs:
  verify-inference-spend-reservation-id-collision-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify inference spend reservation ID collision authority
        run: node scripts/verify-movie-mentor-inference-spend-reservation-id-collision-authority.mjs
