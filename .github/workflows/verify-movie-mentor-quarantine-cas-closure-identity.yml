name: Verify Movie Mentor Quarantine CAS Closure Identity
on:
  push:
    branches: [verify-quarantine-cas-closure-identity]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-quarantine-cas-closure-identity.mjs
