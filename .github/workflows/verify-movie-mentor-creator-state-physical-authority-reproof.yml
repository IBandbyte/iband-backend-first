    paths:
      - "ai/MovieMentorCreatorStateStore.js"
      - "ai/MovieMentorCreatorStateTransition.js"
      - "ai/MovieMentorCreatorDecisionAuthority.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-creator-state-physical-authority-reproof.mjs"
      - ".github/workflows/verify-movie-mentor-creator-state-physical-authority-reproof.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
