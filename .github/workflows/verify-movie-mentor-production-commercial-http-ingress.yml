name: Verify Movie Mentor Production Commercial HTTP Ingress
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check 5A.15 syntax
        run: |
          node --check ai/MovieMentorProductionCommercialHttpIngress.js
          node --check server.js
      - name: Verify 5A.15 production commercial HTTP ingress
        run: node scripts/verify-movie-mentor-production-commercial-http-ingress.mjs
      - name: Regress 5A.14 Stripe adapter
        run: node scripts/verify-movie-mentor-stripe-commercial-provider-adapter.mjs
      - name: Regress 5A.13 policy
        run: node scripts/verify-movie-mentor-production-commercial-policy.mjs
      - name: Regress 5A.12 creator gateway
        run: node scripts/verify-movie-mentor-creator-commercial-gateway.mjs
      - name: Regress 5A.11 provider ingress
        run: node scripts/verify-movie-mentor-commercial-provider-ingress-authority.mjs
      - name: Regress 5A.10 checkout
        run: node scripts/verify-movie-mentor-commercial-checkout-initiation-authority.mjs
      - name: Regress 5A.9 purchase intent
        run: node scripts/verify-movie-mentor-commercial-purchase-intent-authority.mjs
      - name: Regress 5A.8 settlement
        run: node scripts/verify-movie-mentor-inference-spend-settlement-authority.mjs
      - name: Regress 5A.7 evidence
        run: node scripts/verify-movie-mentor-commercial-payment-evidence-authority.mjs
      - name: Regress 5A.6 issuance
        run: node scripts/verify-movie-mentor-entitlement-issuance-authority.mjs
      - name: Regress 5A.5 spend
        run: node scripts/verify-movie-mentor-inference-spend-authority.mjs
