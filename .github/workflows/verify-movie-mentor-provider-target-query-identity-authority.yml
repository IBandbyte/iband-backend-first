name: Verify Movie Mentor Provider Target Query Identity Authority

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-movie-mentor-provider-target-query-identity-authority.yml"
      - ".github/workflows/ci-backend.yml"
      - "scripts/verify-movie-mentor-provider-target-query-identity-authority.mjs"
      - "ai/MovieMentorProviderTargetAuthority.js"
      - "ai/MovieMentorProviderOperationAuthority.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-movie-mentor-provider-target-query-identity-authority.yml"
      - ".github/workflows/ci-backend.yml"
      - "scripts/verify-movie-mentor-provider-target-query-identity-authority.mjs"
      - "ai/MovieMentorProviderTargetAuthority.js"
      - "ai/MovieMentorProviderOperationAuthority.js"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check provider target query-identity authority syntax
        run: |
          node --check ai/MovieMentorProviderTargetAuthority.js
          node --check scripts/verify-movie-mentor-provider-target-query-identity-authority.mjs
      - name: Verify provider target query-identity authority
        run: node scripts/verify-movie-mentor-provider-target-query-identity-authority.mjs
