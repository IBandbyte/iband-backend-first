name: Verify Movie Mentor Unbound Release Entitlement Chronology
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Syntax check unbound release entitlement chronology
        run: node --check scripts/verify-movie-mentor-unbound-release-entitlement-chronology.mjs
      - name: Verify unbound release entitlement chronology
        run: node scripts/verify-movie-mentor-unbound-release-entitlement-chronology.mjs
