name: Verify Movie Mentor Fresh Execution Creation Authority

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ai/MovieMentorForwardExecutionAuthority.js"
      - "ai/MovieMentorForwardExecutionRuntime.js"
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "movieMentorTurn.js"
      - "scripts/verify-movie-mentor-fresh-execution-creation-authority.mjs"
      - ".github/workflows/verify-movie-mentor-fresh-execution-creation-authority.yml"
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorForwardExecutionAuthority.js"
      - "ai/MovieMentorForwardExecutionRuntime.js"
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "movieMentorTurn.js"
      - "scripts/verify-movie-mentor-fresh-execution-creation-authority.mjs"
      - ".github/workflows/verify-movie-mentor-fresh-execution-creation-authority.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check fresh execution creation authority syntax
        run: |
          node --check ai/MovieMentorForwardExecutionAuthority.js
          node --check ai/MovieMentorForwardExecutionRuntime.js
          node --check ai/MovieMentorInferenceExecutionLeaseAuthority.js
          node --check ai/MovieMentorProductionInferenceExecutionComposition.js
          node --check scripts/verify-movie-mentor-fresh-execution-creation-authority.mjs
      - name: Verify fresh execution creation authority
        run: node scripts/verify-movie-mentor-fresh-execution-creation-authority.mjs
