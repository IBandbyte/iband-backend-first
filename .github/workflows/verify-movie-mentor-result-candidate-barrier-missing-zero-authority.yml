name: Verify Movie Mentor Result Candidate Barrier Missing Zero Authority
on:
  pull_request:
  push:
    paths:
      - ai/MovieMentorInferenceExecutionMongoStore.js
      - scripts/verify-movie-mentor-result-candidate-barrier-missing-zero-authority.mjs
      - .github/workflows/verify-movie-mentor-result-candidate-barrier-missing-zero-authority.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: docker run -d --name movie-mentor-mongo -p 27017:27017 mongo:7.0
      - run: |
          for i in {1..30}; do (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1
      - run: node scripts/verify-movie-mentor-result-candidate-barrier-missing-zero-authority.mjs
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_candidate_barrier_missing_zero
