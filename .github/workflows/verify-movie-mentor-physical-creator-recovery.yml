name: Verify Movie Mentor Physical Creator Recovery
on:
  push:
    branches:
      - verify/creator-state-read-ownership-d5f82a98
  workflow_dispatch:
jobs:
  physical-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_physical_creator_recovery
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test dependencies without writing a lockfile
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Physical signed HTTP and durable Mongo creator recovery court
        run: node scripts/verify-movie-mentor-physical-creator-recovery.mjs
