name: Verify Movie Mentor Physical Creator Recovery
on:
  push:
    branches:
      - verify/creator-state-read-ownership-d5f82a98
  workflow_dispatch:
jobs:
  physical-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_physical_creator_recovery?replicaSet=rs0
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test dependencies without writing a lockfile
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Initialize isolated Mongo replica set
        run: |
          docker exec "${{ job.services.mongo.id }}" mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec "${{ job.services.mongo.id }}" mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then
              echo "Mongo replica-set PRIMARY ready"
              exit 0
            fi
            sleep 2
          done
          echo "Mongo replica-set PRIMARY did not become ready" >&2
          exit 1
      - name: Physical signed HTTP and durable Mongo creator recovery court
        run: node scripts/verify-movie-mentor-physical-creator-recovery.mjs
