name: Verify Movie Mentor Provider Recovery Identity Authority

on:
  pull_request:
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "ai/MovieMentorProviderEffectAuthority.js"
      - "ai/MovieMentorProviderEffectMongoStore.js"
      - "ai/MovieMentorInferenceExecutionClosureAuthority.js"
      - "ai/StructuredAIProviderClient.js"
      - "ai/MovieMentorSemanticInterpreter.js"
      - "ai/MovieMentorProviderTargetAuthority.js"
      - "scripts/verify-movie-mentor-provider-recovery-identity-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-recovery-identity-authority.yml"
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "ai/MovieMentorProviderEffectAuthority.js"
      - "ai/MovieMentorProviderEffectMongoStore.js"
      - "ai/MovieMentorInferenceExecutionClosureAuthority.js"
      - "ai/StructuredAIProviderClient.js"
      - "ai/MovieMentorSemanticInterpreter.js"
      - "ai/MovieMentorProviderTargetAuthority.js"
      - "scripts/verify-movie-mentor-provider-recovery-identity-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-recovery-identity-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check provider recovery identity authority syntax
        run: |
          node --check ai/MovieMentorTurnRuntime.js
          node --check ai/MovieMentorInferenceExecutionLeaseAuthority.js
          node --check ai/MovieMentorInferenceExecutionMongoStore.js
          node --check ai/MovieMentorProviderEffectAuthority.js
          node --check ai/MovieMentorProviderEffectMongoStore.js
          node --check ai/MovieMentorInferenceExecutionClosureAuthority.js
          node --check ai/StructuredAIProviderClient.js
          node --check ai/MovieMentorSemanticInterpreter.js
          if [ -f ai/MovieMentorProviderTargetAuthority.js ]; then node --check ai/MovieMentorProviderTargetAuthority.js; fi
          node --check scripts/verify-movie-mentor-provider-recovery-identity-authority.mjs
      - name: Verify provider recovery identity authority
        run: node scripts/verify-movie-mentor-provider-recovery-identity-authority.mjs
