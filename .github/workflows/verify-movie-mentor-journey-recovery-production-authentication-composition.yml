name: Verify Movie Mentor Journey Recovery Production Authentication Composition

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check production authentication composition
        run: node --check ai/MovieMentorJourneyRecoveryProductionAuthenticationComposition.js

      - name: Syntax check production authentication composition torture
        run: node --check scripts/verify-movie-mentor-journey-recovery-production-authentication-composition.mjs

      - name: Verify production authentication composition
        run: node scripts/verify-movie-mentor-journey-recovery-production-authentication-composition.mjs
