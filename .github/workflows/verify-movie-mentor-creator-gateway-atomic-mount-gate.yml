name: Verify Movie Mentor Creator Gateway Atomic Mount Gate

on:
  workflow_dispatch:
  push:
    branches:
      - verify/creator-atomic-production-mount-court-20261104
    paths:
      - ".github/workflows/verify-movie-mentor-creator-gateway-atomic-mount-gate.yml"
      - "scripts/verify-movie-mentor-creator-gateway-atomic-mount-gate.mjs"
      - "ai/MovieMentorCreatorGatewayAtomicMountGate.js"

jobs:
  verify-creator-gateway-atomic-mount-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check scripts/verify-movie-mentor-creator-gateway-atomic-mount-gate.mjs
      - run: node scripts/verify-movie-mentor-creator-gateway-atomic-mount-gate.mjs
