name: Verify Movie Mentor Isolated Creator State Read Ownership
on:
  push:
    branches:
      - verify/creator-state-read-ownership-d5f82a98
  workflow_dispatch:
jobs:
  read-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated dependencies for real Clerk provenance court
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Authenticated ownership-bound read-only contract
        run: node scripts/verify-movie-mentor-creator-state-read-ownership.mjs
      - name: Owner provenance and durable identity denial matrix
        run: node scripts/verify-movie-mentor-creator-state-read-denial-matrix.mjs
      - name: In-flight ownership revocation denial
        run: node scripts/verify-movie-mentor-creator-state-read-revocation-race.mjs
      - name: Authenticated read-only HTTP recovery contract
        run: node scripts/verify-movie-mentor-creator-state-recovery-http-contract.mjs
      - name: Signed credential and durable read composition contract
        run: node scripts/verify-movie-mentor-creator-state-recovery-production-composition.mjs
      - name: Production Express recovery and owned-projects path wiring
        run: node scripts/verify-movie-mentor-server-read-recovery-wiring.mjs
      - name: Durable owner-filtered project discovery authority
        if: always()
        run: node scripts/verify-movie-mentor-owned-projects-read-authority.mjs
      - name: Physical Express frontend GET recovery and discovery contract
        if: always()
        run: node scripts/verify-movie-mentor-read-express-physical-contract.mjs
      - name: Bounded deterministic durable owner discovery
        if: always()
        run: node scripts/verify-movie-mentor-owned-projects-bounded-discovery.mjs
      - name: Project 101 overflow denial without silent truncation
        if: always()
        run: node scripts/verify-movie-mentor-owned-projects-overflow-denial.mjs
      - name: Physical ownership unique-index readiness before discovery
        if: always()
        run: node scripts/verify-movie-mentor-owned-discovery-index-readiness.mjs
      - name: Read-only ingress recovery remount contract
        if: always()
        run: node scripts/verify-movie-mentor-read-recovery-remount.mjs
      - name: Read-only recovery remount single-flight contract
        if: always()
        run: node scripts/verify-movie-mentor-read-remount-single-flight.mjs
      - name: Runtime concurrent read-only recovery single-flight
        if: always()
        run: node scripts/verify-movie-mentor-read-remount-runtime.mjs
      - name: Runtime gateway recovery callback and failed startup
        if: always()
        run: node scripts/verify-movie-mentor-read-recovery-callback-runtime.mjs
      - name: Runtime failed-readiness single-flight retry
        if: always()
        run: node scripts/verify-movie-mentor-read-remount-failed-readiness-retry.mjs
      - name: Runtime loopback Express HTTP read-only remount
        if: always()
        run: node scripts/verify-movie-mentor-read-remount-express-http.mjs
