name: Verify Movie Mentor Settlement Current Entitlement Status Authority
on:
  pull_request:
  push:
    branches:
      - verify-settlement-current-entitlement-status-authority
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check scripts/verify-movie-mentor-settlement-current-entitlement-status-authority.mjs
      - run: node scripts/verify-movie-mentor-settlement-current-entitlement-status-authority.mjs
