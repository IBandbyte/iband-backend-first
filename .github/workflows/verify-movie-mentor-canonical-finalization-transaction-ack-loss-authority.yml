name: Verify Movie Mentor Canonical Finalization Transaction Ack Loss Authority
on:
  push:
    branches: [verify-canonical-finalization-transaction-ack-loss-authority]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check scripts/verify-movie-mentor-canonical-finalization-transaction-ack-loss-authority.mjs
      - run: node scripts/verify-movie-mentor-canonical-finalization-transaction-ack-loss-authority.mjs
