name: Verify Movie Mentor Creator Mongo Startup Behaviour
on:
  workflow_dispatch:
  push:
    branches:
      - verify/creator-atomic-production-mount-court-20261104
    paths:
      - ".github/workflows/verify-movie-mentor-creator-mongo-startup-behaviour.yml"
      - "scripts/verify-movie-mentor-creator-mongo-startup-behaviour.mjs"
      - "ai/MovieMentorCreatorMongoStartupPreparation.js"
jobs:
  startup-behaviour:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/verify-movie-mentor-creator-mongo-startup-behaviour.mjs
