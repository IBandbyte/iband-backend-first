name: Verify Movie Mentor Live Semantic Path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-movie-mentor-live.yml"

permissions:
  contents: write

jobs:
  live-semantic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wait for Render deployment to settle
        run: sleep 75

      - name: Verify live provider and real semantic model behaviour
        id: live_test
        continue-on-error: true
        env:
          IBAND_LIVE_BACKEND_URL: https://iband-backend-first-1.onrender.com
          IBAND_LIVE_REPORT_PATH: verification-results/movie-mentor-live.json
        run: node scripts/verify-movie-mentor-live.mjs

      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-results/movie-mentor-live.json
          if git diff --cached --quiet; then
            echo "No verification report change to commit."
          else
            git commit -m "test: record live Movie Mentor semantic verification"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce live verification result
        run: |
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("verification-results/movie-mentor-live.json","utf8")); console.log(JSON.stringify(r,null,2)); if(!r.passed) process.exit(1);'
