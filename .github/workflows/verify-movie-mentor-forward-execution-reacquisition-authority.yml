name: Verify Movie Mentor Forward Execution Reacquisition Authority

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "movieMentorTurn.js"
      - "ai/MovieMentorForwardExecutionAuthority.js"
      - "ai/MovieMentorForwardExecutionRuntime.js"
      - "scripts/verify-movie-mentor-forward-execution-reacquisition-authority.mjs"
      - ".github/workflows/verify-movie-mentor-forward-execution-reacquisition-authority.yml"
  push:
    branches: [main]
    paths:
      - "movieMentorTurn.js"
      - "ai/MovieMentorForwardExecutionAuthority.js"
      - "ai/MovieMentorForwardExecutionRuntime.js"
      - "scripts/verify-movie-mentor-forward-execution-reacquisition-authority.mjs"
      - ".github/workflows/verify-movie-mentor-forward-execution-reacquisition-authority.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check syntax
        run: |
          node --check ai/MovieMentorForwardExecutionAuthority.js
          node --check ai/MovieMentorForwardExecutionRuntime.js
          node --check scripts/verify-movie-mentor-forward-execution-reacquisition-authority.mjs
      - name: ROUND SEVEN forward execution reacquisition torture
        run: node scripts/verify-movie-mentor-forward-execution-reacquisition-authority.mjs
