name: Verify Movie Mentor Creator Compensation Current Reality Authority
on:
  pull_request:
    branches: [verify-quarantine-reality-serialization-authority]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-creator-compensation-current-reality-authority.mjs
