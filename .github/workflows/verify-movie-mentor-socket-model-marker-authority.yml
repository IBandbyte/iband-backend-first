name: Verify Movie Mentor Socket Model Marker Authority

on:
  push:
    paths:
      - "ai/StructuredAIProviderClient.js"
      - "scripts/verify-movie-mentor-socket-model-marker-authority.mjs"
      - "scripts/verify-movie-mentor-provider-null-model-runtime-backend-ci-authority.mjs"
      - ".github/workflows/verify-movie-mentor-socket-model-marker-authority.yml"
  pull_request:
    paths:
      - "ai/StructuredAIProviderClient.js"
      - "scripts/verify-movie-mentor-socket-model-marker-authority.mjs"
      - "scripts/verify-movie-mentor-provider-null-model-runtime-backend-ci-authority.mjs"
      - ".github/workflows/verify-movie-mentor-socket-model-marker-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check ai/StructuredAIProviderClient.js
      - run: node --check scripts/verify-movie-mentor-socket-model-marker-authority.mjs
      - run: node --check scripts/verify-movie-mentor-provider-null-model-runtime-backend-ci-authority.mjs
      - run: node scripts/verify-movie-mentor-socket-model-marker-authority.mjs
