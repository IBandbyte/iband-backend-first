name: Verify Movie Mentor Creator Commercial Owner Provenance
on:
  push:
    branches: [main]
    paths:
      - 'ai/MovieMentorProductionCreatorCommercialComposition.js'
      - 'ai/MovieMentorProductionCommercialHttpIngress.js'
      - 'scripts/verify-movie-mentor-creator-commercial-owner-provenance.mjs'
      - '.github/workflows/verify-movie-mentor-creator-commercial-owner-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check syntax
        run: node --check ai/MovieMentorProductionCreatorCommercialComposition.js && node --check ai/MovieMentorProductionCommercialHttpIngress.js && node --check scripts/verify-movie-mentor-creator-commercial-owner-provenance.mjs
      - name: Verify creator commercial owner provenance
        run: node scripts/verify-movie-mentor-creator-commercial-owner-provenance.mjs
      - name: Regress creator commercial gateway
        run: node scripts/verify-movie-mentor-creator-commercial-gateway.mjs
      - name: Regress commercial HTTP ingress
        run: node scripts/verify-movie-mentor-production-commercial-http-ingress.mjs
