name: Verify Movie Mentor Reversal Before Payment Lineage Authority

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai/**'
      - 'scripts/verify-movie-mentor-reversal-before-payment-lineage-authority.mjs'
      - '.github/workflows/verify-movie-mentor-reversal-before-payment-lineage-authority.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check scripts/verify-movie-mentor-reversal-before-payment-lineage-authority.mjs
      - run: node scripts/verify-movie-mentor-reversal-before-payment-lineage-authority.mjs
