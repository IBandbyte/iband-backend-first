name: Verify Movie Mentor Checkout Pre-Dispatch Current Auth

on:
  pull_request:
    paths:
      - "ai/MovieMentorCommercialCheckoutInitiationAuthority.js"
      - "scripts/verify-movie-mentor-checkout-pre-dispatch-current-auth.mjs"
      - ".github/workflows/verify-movie-mentor-checkout-pre-dispatch-current-auth.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check scripts/verify-movie-mentor-checkout-pre-dispatch-current-auth.mjs
      - run: node --check ai/MovieMentorCommercialCheckoutInitiationAuthority.js
      - run: node scripts/verify-movie-mentor-checkout-pre-dispatch-current-auth.mjs
