name: Verify Movie Mentor Journey Recovery HTTP Transport Adapter

on:
  push:
    paths:
      - 'ai/MovieMentorJourneyRecoveryHttpTransportAdapter.js'
      - 'ai/MovieMentorJourneyRecoveryPublicationBoundary.js'
      - 'ai/MovieMentorJourneyRecoveryRequestAuthority.js'
      - 'ai/MovieMentorDeterministicPrincipalAdapter.js'
      - 'ai/MovieMentorJourneyRecoveryAuthorizationBoundary.js'
      - 'ai/MovieMentorProjectOwnershipRegistry.js'
      - 'ai/MovieMentorJourneyRecoveryEnvelope.js'
      - 'ai/MovieMentorJourneyRecoveryTransition.js'
      - 'ai/MovieMentorJourneyRecoveryStore.js'
      - 'scripts/verify-movie-mentor-journey-recovery-http-transport-adapter.mjs'
      - '.github/workflows/verify-movie-mentor-journey-recovery-http-transport-adapter.yml'
  pull_request:
    paths:
      - 'ai/MovieMentorJourneyRecoveryHttpTransportAdapter.js'
      - 'ai/MovieMentorJourneyRecoveryPublicationBoundary.js'
      - 'ai/MovieMentorJourneyRecoveryRequestAuthority.js'
      - 'ai/MovieMentorDeterministicPrincipalAdapter.js'
      - 'ai/MovieMentorJourneyRecoveryAuthorizationBoundary.js'
      - 'ai/MovieMentorProjectOwnershipRegistry.js'
      - 'ai/MovieMentorJourneyRecoveryEnvelope.js'
      - 'ai/MovieMentorJourneyRecoveryTransition.js'
      - 'ai/MovieMentorJourneyRecoveryStore.js'
      - 'scripts/verify-movie-mentor-journey-recovery-http-transport-adapter.mjs'
      - '.github/workflows/verify-movie-mentor-journey-recovery-http-transport-adapter.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check HTTP transport adapter syntax
        run: node --check ai/MovieMentorJourneyRecoveryHttpTransportAdapter.js
      - name: Torture recovery HTTP transport adapter
        run: node scripts/verify-movie-mentor-journey-recovery-http-transport-adapter.mjs
