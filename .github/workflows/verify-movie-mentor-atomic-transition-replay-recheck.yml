name: Verify Movie Mentor Atomic Transition Replay Recheck
on:
  workflow_dispatch:
  push:
    branches:
      - verify/creator-atomic-production-mount-court-20261104
    paths:
      - ".github/workflows/verify-movie-mentor-atomic-transition-replay-recheck.yml"
      - "scripts/verify-movie-mentor-creator-state-transition-atomic-integration.mjs"
      - "ai/MovieMentorCreatorStateTransition.js"
jobs:
  atomic-transition-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: node scripts/verify-movie-mentor-creator-state-transition-atomic-integration.mjs
