name: Verify Movie Mentor Native Project Creation Ingress

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ai/MovieMentorProjectOwnershipRegistry.js"
      - "ai/MovieMentorNativeProjectCreationAuthority.js"
      - "movieMentorProjects.js"
      - "movieMentorTurn.js"
      - "server.js"
      - "scripts/verify-movie-mentor-native-project-creation-ingress.mjs"
      - ".github/workflows/verify-movie-mentor-native-project-creation-ingress.yml"
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorProjectOwnershipRegistry.js"
      - "ai/MovieMentorNativeProjectCreationAuthority.js"
      - "movieMentorProjects.js"
      - "movieMentorTurn.js"
      - "server.js"
      - "scripts/verify-movie-mentor-native-project-creation-ingress.mjs"
      - ".github/workflows/verify-movie-mentor-native-project-creation-ingress.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check native project creation authority
        run: node --check ai/MovieMentorNativeProjectCreationAuthority.js
      - name: Syntax check native project creation router
        run: node --check movieMentorProjects.js
      - name: Syntax check production composition
        run: node --check server.js
      - name: Syntax check native project creation court
        run: node --check scripts/verify-movie-mentor-native-project-creation-ingress.mjs
      - name: Verify native project creation production ingress
        run: node scripts/verify-movie-mentor-native-project-creation-ingress.mjs
