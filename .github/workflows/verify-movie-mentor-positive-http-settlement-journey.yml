name: Verify Movie Mentor Positive HTTP Settlement Journey
on:
  push:
    branches:
      - verify/positive-http-settlement-journey-20261110
  workflow_dispatch:
jobs:
  positive-http-settlement-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_positive_http_settlement?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated dependencies without writing lockfile
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Start disposable loopback Mongo replica set
        run: |
          docker run -d --name movie-mentor-positive-http-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec movie-mentor-positive-http-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec movie-mentor-positive-http-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 40); do
            if docker exec movie-mentor-positive-http-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "Isolated Mongo replica set did not become PRIMARY" >&2
          exit 1
      - name: Bootstrap required physical execution and settlement indexes in disposable Mongo
        run: |
          node --input-type=module <<'EOF'
          import mongoose from "mongoose";
          import {MOVIE_MENTOR_INFERENCE_EXECUTION_REQUIRED_UNIQUE_INDEXES as execution} from "./ai/MovieMentorInferenceExecutionPhysicalAuthority.js";
          import {MOVIE_MENTOR_INFERENCE_SETTLEMENT_REQUIRED_UNIQUE_INDEXES as settlement} from "./ai/MovieMentorInferenceSettlementPhysicalAuthority.js";
          const uri=process.env.MOVIE_MENTOR_ISOLATED_MONGO_URI;
          if(!/^mongodb:\/\/127\.0\.0\.1:27017\/movie_mentor_positive_http_settlement\?/.test(uri||""))throw new Error("Refusing non-disposable Mongo target");
          await mongoose.connect(uri,{autoIndex:false});
          try {
            const requirements=new Map([...execution,...settlement].map(r=>[r.collection+":"+JSON.stringify(r.key),r]));
            for(const r of requirements.values())await mongoose.connection.db.collection(r.collection).createIndex(r.key,{unique:true});
            for(const r of requirements.values()){
              const indexes=await mongoose.connection.db.collection(r.collection).indexes();
              if(!indexes.some(i=>i.unique===true&&JSON.stringify(i.key)===JSON.stringify(r.key)))throw new Error("Missing physical unique index "+r.collection+" "+JSON.stringify(r.key));
            }
            const providerOperation=mongoose.connection.db.collection("movie_mentor_provider_operation_reality");
            await providerOperation.createIndex({providerCallId:1},{unique:true});
            const operationIndexes=await providerOperation.indexes();
            if(!operationIndexes.some(i=>i.unique===true&&JSON.stringify(i.key)===JSON.stringify({providerCallId:1})))throw new Error("Missing provider-operation physical unique index");
            console.log("GREEN isolated provider-operation physical unique index verified");
            console.log("GREEN isolated physical index bootstrap: "+requirements.size+" required unique indexes verified");
          }finally{await mongoose.disconnect();}
          EOF
      - name: Physical signed HTTP execution settlement and fresh-process replay
        run: node scripts/verify-movie-mentor-positive-http-settlement-physical.mjs
