    branches:
      - verify/creator-atomic-production-mount-court-20261104
    paths:
      - ".github/workflows/verify-movie-mentor-creator-gateway-recovery-registration.yml"
      - "scripts/verify-movie-mentor-creator-gateway-recovery-registration.mjs"
      - "server.js"
jobs:
  recovery-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
