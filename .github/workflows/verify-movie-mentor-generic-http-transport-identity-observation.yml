name: Movie Mentor generic HTTP transport identity observation
on:
  push:
    branches:
      - audit/creator-first-commit-takeover-verifier
    paths:
      - scripts/verify-movie-mentor-generic-http-transport-identity-observation.mjs
      - .github/workflows/verify-movie-mentor-generic-http-transport-identity-observation.yml
      - ai/StructuredAIProviderClient.js
  workflow_dispatch:
jobs:
  transport-identity-observation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture generic HTTP outbound identity
        run: node scripts/verify-movie-mentor-generic-http-transport-identity-observation.mjs
