name: Verify Movie Mentor Execution Closure Authority Lagging Clock Delegation
on:
  push:
    paths:
      - "ai/MovieMentorInferenceExecutionClosureAuthority.js"
      - "scripts/verify-movie-mentor-execution-closure-authority-lagging-clock-delegation.mjs"
      - ".github/workflows/verify-movie-mentor-execution-closure-authority-lagging-clock-delegation.yml"
  pull_request:
    paths:
      - "ai/MovieMentorInferenceExecutionClosureAuthority.js"
      - "scripts/verify-movie-mentor-execution-closure-authority-lagging-clock-delegation.mjs"
      - ".github/workflows/verify-movie-mentor-execution-closure-authority-lagging-clock-delegation.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-movie-mentor-execution-closure-authority-lagging-clock-delegation.mjs
