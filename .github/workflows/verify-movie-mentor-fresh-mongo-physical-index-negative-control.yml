name: Verify Movie Mentor Fresh Mongo Physical Index Negative Control
on:
  push:
    branches:
      - verify/creator-atomic-production-mount-court-20261104
  workflow_dispatch:
jobs:
  physical-index-negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Start disposable Mongo replica set
        run: |
          docker run -d --name movie-mentor-index-negative-court -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec movie-mentor-index-negative-court mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec movie-mentor-index-negative-court mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec movie-mentor-index-negative-court mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Inspect actual fresh Mongo unique indexes without creating them
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_isolated_index_negative?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-fresh-mongo-physical-index-negative-control.mjs
