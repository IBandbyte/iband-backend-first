name: Verify Movie Mentor Post-Suspension Creator Compensation Disposition Authority
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-movie-mentor-post-suspension-creator-compensation-disposition-authority.mjs
