name: Verify Movie Mentor Purchase Intent Physical Authority

on:
  push:
    paths:
      - "ai/MovieMentorCommercialPurchaseIntentMongoStore.js"
      - "ai/MovieMentorProductionCommercialPurchaseIntentComposition.js"
      - "ai/MovieMentorProductionCommercialHttpIngress.js"
      - "server.js"
      - "scripts/verify-movie-mentor-purchase-intent-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-purchase-intent-physical-authority.yml"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "ai/MovieMentorCommercialPurchaseIntentMongoStore.js"
      - "ai/MovieMentorProductionCommercialPurchaseIntentComposition.js"
      - "ai/MovieMentorProductionCommercialHttpIngress.js"
      - "server.js"
      - "scripts/verify-movie-mentor-purchase-intent-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-purchase-intent-physical-authority.yml"
      - ".github/workflows/ci-backend.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check ai/MovieMentorCommercialPurchaseIntentMongoStore.js
      - run: node --check scripts/verify-movie-mentor-purchase-intent-physical-authority.mjs
      - run: node scripts/verify-movie-mentor-purchase-intent-physical-authority.mjs
