name: Verify Movie Mentor Settlement Candidate Lineage Response Authority

on:
  push:
    paths:
      - 'ai/MovieMentorTurnRuntime.js'
      - 'ai/MovieMentorInferenceSettlementReconciliationAuthority.js'
      - 'ai/MovieMentorInferenceSettlementMongoStore.js'
      - 'scripts/verify-movie-mentor-settlement-candidate-lineage-response-authority.mjs'
      - '.github/workflows/verify-movie-mentor-settlement-candidate-lineage-response-authority.yml'
  pull_request:
    paths:
      - 'ai/MovieMentorTurnRuntime.js'
      - 'ai/MovieMentorInferenceSettlementReconciliationAuthority.js'
      - 'ai/MovieMentorInferenceSettlementMongoStore.js'
      - 'scripts/verify-movie-mentor-settlement-candidate-lineage-response-authority.mjs'
      - '.github/workflows/verify-movie-mentor-settlement-candidate-lineage-response-authority.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/verify-movie-mentor-settlement-candidate-lineage-response-authority.mjs
