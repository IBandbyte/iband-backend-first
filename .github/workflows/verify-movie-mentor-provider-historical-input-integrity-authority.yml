name: Verify Movie Mentor Provider Historical Input Integrity Authority

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-movie-mentor-provider-historical-input-integrity-authority.yml"
      - ".github/workflows/ci-backend.yml"
      - "scripts/verify-movie-mentor-provider-historical-input-integrity-authority.mjs"
      - "ai/MovieMentorRecoveredProviderResultAuthority.js"
      - "ai/MovieMentorProviderOperationAuthority.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-movie-mentor-provider-historical-input-integrity-authority.yml"
      - ".github/workflows/ci-backend.yml"
      - "scripts/verify-movie-mentor-provider-historical-input-integrity-authority.mjs"
      - "ai/MovieMentorRecoveredProviderResultAuthority.js"
      - "ai/MovieMentorProviderOperationAuthority.js"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check historical input integrity authority syntax
        run: |
          node --check ai/MovieMentorProviderOperationAuthority.js
          node --check ai/MovieMentorRecoveredProviderResultAuthority.js
          node --check scripts/verify-movie-mentor-provider-historical-input-integrity-authority.mjs
      - name: Verify historical input digest integrity authority
        run: node scripts/verify-movie-mentor-provider-historical-input-integrity-authority.mjs
