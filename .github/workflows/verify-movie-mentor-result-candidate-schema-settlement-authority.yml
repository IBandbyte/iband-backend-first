name: Verify Movie Mentor Result Candidate Schema Settlement Authority

on:
  pull_request:
    paths:
      - "ai/MovieMentorResultCandidateMongoStore.js"
      - "ai/MovieMentorInferenceSettlementMongoStore.js"
      - "scripts/verify-movie-mentor-result-candidate-schema-settlement-authority.mjs"
      - ".github/workflows/verify-movie-mentor-result-candidate-schema-settlement-authority.yml"
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorResultCandidateMongoStore.js"
      - "ai/MovieMentorInferenceSettlementMongoStore.js"
      - "scripts/verify-movie-mentor-result-candidate-schema-settlement-authority.mjs"
      - ".github/workflows/verify-movie-mentor-result-candidate-schema-settlement-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check result-candidate schema settlement authority syntax
        run: |
          node --check ai/MovieMentorResultCandidateMongoStore.js
          node --check ai/MovieMentorInferenceSettlementMongoStore.js
          node --check scripts/verify-movie-mentor-result-candidate-schema-settlement-authority.mjs
      - name: Verify result-candidate schema settlement authority
        run: node scripts/verify-movie-mentor-result-candidate-schema-settlement-authority.mjs
