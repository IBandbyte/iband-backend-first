name: Verify Movie Mentor Candidate Closure Serialization Authority

on:
  pull_request:
    branches:
      - verify-active-staged-candidate-recovery-liveness
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-candidate-closure-serialization-authority.mjs
