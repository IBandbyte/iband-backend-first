name: Verify Movie Mentor Consumption Reservation Return Authority

on:
  push:
    branches:
      - verify-consumption-reservation-return-authority
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check scripts/verify-movie-mentor-consumption-reservation-return-authority.mjs
      - run: node scripts/verify-movie-mentor-consumption-reservation-return-authority.mjs
