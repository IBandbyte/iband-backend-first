name: Verify Movie Mentor Current Execution Schema Unclaimed Release Authority

on:
  push:
    branches:
      - movie-mentor-current-schema-unclaimed-release-authority
  pull_request:
    paths:
      - "ai/MovieMentorInferenceSettlementMongoStore.js"
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "scripts/verify-movie-mentor-current-execution-schema-unclaimed-release-authority.mjs"
      - ".github/workflows/verify-movie-mentor-current-execution-schema-unclaimed-release-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify current execution schema at unclaimed economic release
        run: node scripts/verify-movie-mentor-current-execution-schema-unclaimed-release-authority.mjs
