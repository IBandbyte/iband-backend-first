name: Verify Movie Mentor Provider Effect Decision Failure Recovery Authority
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Syntax check provider-effect decision-failure recovery authority
        run: node --check scripts/verify-movie-mentor-provider-effect-decision-failure-recovery-authority.mjs
      - name: Verify provider-effect decision-failure recovery authority
        run: node scripts/verify-movie-mentor-provider-effect-decision-failure-recovery-authority.mjs
