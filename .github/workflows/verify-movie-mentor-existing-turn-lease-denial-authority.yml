name: Verify Movie Mentor Existing Turn Lease Denial Authority
on:
  push:
    branches: [verify-existing-turn-lease-denial-authority]
  pull_request:
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-existing-turn-lease-denial-authority.mjs"
      - ".github/workflows/verify-movie-mentor-existing-turn-lease-denial-authority.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check scripts/verify-movie-mentor-existing-turn-lease-denial-authority.mjs
      - run: node scripts/verify-movie-mentor-existing-turn-lease-denial-authority.mjs
