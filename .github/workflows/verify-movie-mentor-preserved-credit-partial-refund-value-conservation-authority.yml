name: Verify Movie Mentor Preserved Credit Partial Refund Value Conservation Authority

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 21
      - name: Verify preserved-credit partial-refund value conservation authority
        run: node scripts/verify-movie-mentor-preserved-credit-partial-refund-value-conservation-authority.mjs
