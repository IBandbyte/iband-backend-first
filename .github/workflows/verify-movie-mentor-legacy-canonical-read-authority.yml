name: Verify Movie Mentor Legacy Canonical Read Authority
on:
  pull_request:
    paths:
      - "ai/MovieMentorCanonicalResultAuthority.js"
      - "scripts/verify-movie-mentor-legacy-canonical-read-authority.mjs"
      - ".github/workflows/verify-movie-mentor-legacy-canonical-read-authority.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Syntax check legacy canonical read authority
        run: |
          node --check ai/MovieMentorCanonicalResultAuthority.js
          node --check scripts/verify-movie-mentor-legacy-canonical-read-authority.mjs
      - name: Verify legacy canonical read authority
        run: node scripts/verify-movie-mentor-legacy-canonical-read-authority.mjs
