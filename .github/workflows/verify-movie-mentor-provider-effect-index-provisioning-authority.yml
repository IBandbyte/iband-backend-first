name: Verify Movie Mentor Provider Effect Index Provisioning Authority
on:
  push:
    branches:
      - verify-provider-effect-index-provisioning-authority
  pull_request:
    branches:
      - verify-provider-external-effect-global-identity
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/verify-movie-mentor-provider-effect-index-provisioning-authority.mjs
