name: Verify Movie Mentor Provider Reconstruction Input Bind DB Time Authority
on:
  pull_request:
    paths:
      - 'ai/MovieMentorProviderOperationMongoStore.js'
      - 'scripts/verify-movie-mentor-provider-reconstruction-input-bind-db-time-authority.mjs'
      - '.github/workflows/verify-movie-mentor-provider-reconstruction-input-bind-db-time-authority.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-provider-reconstruction-input-bind-db-time-authority.mjs
