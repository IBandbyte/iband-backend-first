name: Verify Movie Mentor Provider Operation Predispatch Refund Physical Race Authority

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/movie-mentor-provider-operation-refund-physical-race?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Initialize Mongo replica set
        run: |
          mongosh --host 127.0.0.1:27017 --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do
            mongosh --host 127.0.0.1:27017 --quiet --eval 'if (db.hello().isWritablePrimary) quit(0); quit(1)' && break
            sleep 1
          done
      - run: npm install
      - run: node scripts/verify-movie-mentor-provider-operation-predispatch-refund-physical-race-authority.mjs
