name: Verify Movie Mentor reinstatement current-entitlement authority
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund\n      - run: node scripts/verify-movie-mentor-reinstatement-current-entitlement-authority.mjs
