name: Wire Movie Mentor Canonical Schema Settlement Backend CI

on:
  push:
    branches: [movie-mentor-canonical-schema-settlement-authority]
    paths:
      - ".github/workflows/wire-movie-mentor-canonical-schema-settlement-backend-ci.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movie-mentor-canonical-schema-settlement-authority
      - name: Stage exact Backend CI replacement as ordinary blob
        run: |
          python - <<'PY'
          from pathlib import Path
          source_path = Path(".github/workflows/ci-backend.yml")
          source = source_path.read_text()
          needle = "scripts/verify-movie-mentor-canonical-schema-settlement-authority.mjs"
          if needle in source:
              raise SystemExit("canonical schema settlement court is already owned by Backend CI")
          addition = '''\n      - name: Check Movie Mentor canonical schema settlement authority syntax\n        run: node --check scripts/verify-movie-mentor-canonical-schema-settlement-authority.mjs\n      - name: Verify Movie Mentor canonical schema settlement authority\n        run: node scripts/verify-movie-mentor-canonical-schema-settlement-authority.mjs\n'''
          if not source.endswith("\n"):
              source += "\n"
          staged = Path("tmp/ci-backend-canonical-schema-settlement.yml")
          staged.parent.mkdir(parents=True, exist_ok=True)
          staged.write_text(source + addition)
          PY
          git diff --check -- tmp/ci-backend-canonical-schema-settlement.yml
      - name: Commit staged blob
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/ci-backend-canonical-schema-settlement.yml
          git commit -m "Stage Backend CI canonical schema ownership blob"
          git push origin HEAD:movie-mentor-canonical-schema-settlement-authority
