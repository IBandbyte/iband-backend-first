name: Verify Movie Mentor Confirmed Recovery and Settlement Baselines
on:
  push:
    branches:
      - verify/http-interruption-recovery-20261110
  workflow_dispatch:
jobs:
  confirmed-recovery-settlement-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      IBAND_AI_PROVIDER: openai
      IBAND_AI_MODEL: gpt-isolated
      IBAND_AI_API_KEY: isolated-only
      MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_confirmed_settlement_baseline?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated dependencies without lockfile changes
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Start disposable loopback Mongo replica set
        run: |
          docker run -d --name movie-mentor-confirmed-baseline-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec movie-mentor-confirmed-baseline-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec movie-mentor-confirmed-baseline-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 40); do
            if docker exec movie-mentor-confirmed-baseline-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "Isolated Mongo replica set did not become PRIMARY" >&2
          exit 1
      - name: Verify confirmed-effect recovery authority and UNKNOWN denial contracts
        run: node scripts/verify-movie-mentor-provider-outcome-recovery-authority.mjs
      - name: Verify historical recovered-result reconstruction without redispatch
        run: node scripts/verify-movie-mentor-recovered-result-reconstruction-authority.mjs
      - name: Verify physical exactly-once canonical settlement and replay
        run: node scripts/verify-movie-mentor-real-mongo-settlement-positive-replay.mjs
      - name: Preserve certification boundary
        run: |
          echo 'These are independent confirmed-effect recovery, historical-result reconstruction and Mongo settlement baseline courts.'
          echo 'No combined post-SIGKILL confirmed-effect retrieval or resumed HTTP settlement is certified by this workflow.'
