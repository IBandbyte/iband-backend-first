name: Verify Movie Mentor Finalized Suspension Terminal Authority

on:
  pull_request:
    branches: [main]
    paths:
      - "ai/MovieMentorInferenceSettlementMongoStore.js"
      - "scripts/verify-movie-mentor-finalized-suspension-terminal-authority.mjs"
      - ".github/workflows/verify-movie-mentor-finalized-suspension-terminal-authority.yml"
  workflow_dispatch:

jobs:
  verify-finalized-suspension-terminal-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify finalized suspension terminal authority
        run: node scripts/verify-movie-mentor-finalized-suspension-terminal-authority.mjs
