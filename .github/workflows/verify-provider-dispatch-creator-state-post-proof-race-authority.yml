name: Verify Movie Mentor Provider Dispatch Creator State Post Proof Race Authority
on:
  pull_request:
    paths:
      - "ai/MovieMentorCreatorStateConsumptionRuntime.js"
      - "ai/MovieMentorCreatorStateStore.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-provider-dispatch-creator-state-post-proof-race-authority.mjs"
      - ".github/workflows/verify-provider-dispatch-creator-state-post-proof-race-authority.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-movie-mentor-provider-dispatch-creator-state-post-proof-race-authority.mjs
