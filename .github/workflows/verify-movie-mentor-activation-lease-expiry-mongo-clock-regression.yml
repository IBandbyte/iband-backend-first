name: Verify Movie Mentor Activation Lease Expiry Mongo Clock Regression

on:
  push:
    paths:
      - "ai/MovieMentorJourneyRecoveryActivationLeaseMongoStore.js"
      - "scripts/verify-movie-mentor-activation-lease-expiry-mongo-clock-regression.mjs"
      - ".github/workflows/verify-movie-mentor-activation-lease-expiry-mongo-clock-regression.yml"
  pull_request:
    paths:
      - "ai/MovieMentorJourneyRecoveryActivationLeaseMongoStore.js"
      - "scripts/verify-movie-mentor-activation-lease-expiry-mongo-clock-regression.mjs"
      - ".github/workflows/verify-movie-mentor-activation-lease-expiry-mongo-clock-regression.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/iband_activation_lease_clock_regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-activation-lease-expiry-mongo-clock-regression.mjs
