name: Verify Movie Mentor Creator Decision Post Acquisition Binding Structural
on:
  push:
    branches:
      - audit/creator-first-commit-takeover-verifier
    paths:
      - scripts/verify-movie-mentor-creator-decision-post-acquisition-binding-structural.mjs
      - .github/workflows/verify-movie-mentor-creator-decision-post-acquisition-binding-structural.yml
  workflow_dispatch:
jobs:
  structural-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/verify-movie-mentor-creator-decision-post-acquisition-binding-structural.mjs
      - run: node scripts/verify-movie-mentor-creator-decision-post-acquisition-binding-structural.mjs
