name: Verify Movie Mentor Real Server Entrypoint Isolated Boot
on:
  push:
    branches:
      - verify/creator-atomic-production-mount-court-20261104
  workflow_dispatch:
jobs:
  server-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Start disposable Mongo replica set
        run: |
          docker run -d --name movie-mentor-server-boot-court -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec movie-mentor-server-boot-court mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec movie-mentor-server-boot-court mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec movie-mentor-server-boot-court mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify real server entrypoint boot and fail-closed creator surface
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_isolated_server_boot?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-server-entrypoint-isolated-boot.mjs
