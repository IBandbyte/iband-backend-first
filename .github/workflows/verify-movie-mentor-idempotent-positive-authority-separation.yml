name: Verify Movie Mentor Idempotent Positive Authority Separation
on:
  push:
    branches: [audit/creator-first-commit-takeover-verifier]
    paths:
      - scripts/verify-movie-mentor-idempotent-positive-authority-separation.mjs
      - .github/workflows/verify-movie-mentor-idempotent-positive-authority-separation.yml
  workflow_dispatch:
jobs:
  authority-separation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/verify-movie-mentor-idempotent-positive-authority-separation.mjs
      - run: node scripts/verify-movie-mentor-idempotent-positive-authority-separation.mjs
