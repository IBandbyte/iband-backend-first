name: Verify Movie Mentor Semantic Redirect Observation

on:
  push:
    branches:
      - audit/creator-first-commit-takeover-verifier
    paths:
      - scripts/verify-movie-mentor-semantic-redirect-observation.mjs
      - ai/MovieMentorSemanticInterpreter.js
      - .github/workflows/verify-movie-mentor-semantic-redirect-observation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-semantic-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute local loopback redirect observation
        run: node scripts/verify-movie-mentor-semantic-redirect-observation.mjs
