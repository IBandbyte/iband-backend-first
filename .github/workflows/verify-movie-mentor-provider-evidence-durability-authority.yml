name: Verify Movie Mentor Provider Evidence Durability Authority

on:
  push:
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/MovieMentorProviderEffectAuthority.js"
      - "scripts/verify-movie-mentor-provider-evidence-durability-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-evidence-durability-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/MovieMentorProviderEffectAuthority.js"
      - "scripts/verify-movie-mentor-provider-evidence-durability-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-evidence-durability-authority.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/verify-movie-mentor-provider-evidence-durability-authority.mjs
      - run: node scripts/verify-movie-mentor-provider-evidence-durability-authority.mjs
