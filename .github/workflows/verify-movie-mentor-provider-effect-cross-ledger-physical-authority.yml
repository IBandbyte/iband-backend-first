name: Verify Movie Mentor Provider Effect Cross-Ledger Physical Authority

on:
  push:
    paths:
      - "ai/MovieMentorProviderEffectMongoStore.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "scripts/verify-movie-mentor-provider-effect-cross-ledger-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-effect-cross-ledger-physical-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorProviderEffectMongoStore.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "scripts/verify-movie-mentor-provider-effect-cross-ledger-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-effect-cross-ledger-physical-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check scripts/verify-movie-mentor-provider-effect-cross-ledger-physical-authority.mjs
      - run: node --check ai/MovieMentorProviderEffectMongoStore.js
      - run: node scripts/verify-movie-mentor-provider-effect-cross-ledger-physical-authority.mjs
