name: Verify Movie Mentor Legacy Adoption Expiry Cross-Clock Authority
on:
  workflow_dispatch:
  push:
    branches:
      - verify-legacy-adoption-expiry-cross-clock-authority
  pull_request:
    paths:
      - "ai/MovieMentorLegacyProjectOwnershipAdoptionBoundary.js"
      - "ai/MovieMentorProjectOwnershipRegistry.js"
      - "scripts/verify-movie-mentor-legacy-adoption-expiry-cross-clock-authority.mjs"
      - ".github/workflows/verify-movie-mentor-legacy-adoption-expiry-cross-clock-authority.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/verify-movie-mentor-legacy-adoption-expiry-cross-clock-authority.mjs
