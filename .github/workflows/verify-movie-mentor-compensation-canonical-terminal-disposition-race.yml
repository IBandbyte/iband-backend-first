name: Verify Movie Mentor Compensation Canonical Terminal Disposition Race
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-movie-mentor-compensation-canonical-terminal-disposition-race.mjs
