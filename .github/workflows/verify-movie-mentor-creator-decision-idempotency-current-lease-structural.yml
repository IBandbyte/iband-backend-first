name: Verify Movie Mentor Creator Decision Idempotency Current Lease Structural
on:
  push:
    branches: [audit/creator-first-commit-takeover-verifier]
    paths:
      - scripts/verify-movie-mentor-creator-decision-idempotency-current-lease-structural.mjs
      - .github/workflows/verify-movie-mentor-creator-decision-idempotency-current-lease-structural.yml
  workflow_dispatch:
jobs:
  idempotency-lease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/verify-movie-mentor-creator-decision-idempotency-current-lease-structural.mjs
      - run: node scripts/verify-movie-mentor-creator-decision-idempotency-current-lease-structural.mjs
