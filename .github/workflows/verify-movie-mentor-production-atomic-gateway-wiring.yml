name: Verify Movie Mentor Production Atomic Gateway Wiring

on:
  workflow_dispatch:
  push:
    branches:
      - verify/creator-atomic-production-mount-court-20261104
    paths:
      - ".github/workflows/verify-movie-mentor-production-atomic-gateway-wiring.yml"
      - "scripts/verify-movie-mentor-production-atomic-gateway-wiring.mjs"
      - "server.js"
      - "movieMentorTurn.js"

jobs:
  verify-production-atomic-gateway-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check scripts/verify-movie-mentor-production-atomic-gateway-wiring.mjs
      - run: node scripts/verify-movie-mentor-production-atomic-gateway-wiring.mjs
