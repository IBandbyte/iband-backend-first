name: Verify Movie Mentor Provider Admission Closure Chronology Authority
on:
  push:
    branches:
      - verify-provider-admission-closure-chronology-authority
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check scripts/verify-movie-mentor-provider-admission-closure-chronology-authority.mjs
      - run: node scripts/verify-movie-mentor-provider-admission-closure-chronology-authority.mjs
