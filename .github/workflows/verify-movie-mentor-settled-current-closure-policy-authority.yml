name: Verify Movie Mentor Settled Current Closure Policy Authority
on:
  push:
    branches: [verify-settled-current-closure-policy-authority]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-settled-current-closure-policy-authority.mjs
