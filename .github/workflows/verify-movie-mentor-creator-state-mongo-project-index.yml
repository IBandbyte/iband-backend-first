name: Verify Movie Mentor Mongo Physical Project Index
on:
  push:
    branches:
      - verify/creator-state-sync-provenance-court-20261103
  workflow_dispatch:
jobs:
  project-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify project CAS physical uniqueness before transaction
        run: node scripts/verify-movie-mentor-creator-state-mongo-project-index.mjs
