name: Verify Movie Mentor Provider Historical Input Authority

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-movie-mentor-provider-historical-input-authority.yml"
      - ".github/workflows/ci-backend.yml"
      - "scripts/verify-movie-mentor-provider-historical-input-authority.mjs"
      - "ai/MovieMentorRecoveredProviderResultAuthority.js"
      - "ai/MovieMentorProviderOperationAuthority.js"
      - "ai/MovieMentorProviderOperationMongoStore.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/MovieMentorRecoveredSemanticResult.js"
      - "ai/MovieMentorRecoveredTaskResult.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-movie-mentor-provider-historical-input-authority.yml"
      - ".github/workflows/ci-backend.yml"
      - "scripts/verify-movie-mentor-provider-historical-input-authority.mjs"
      - "ai/MovieMentorRecoveredProviderResultAuthority.js"
      - "ai/MovieMentorProviderOperationAuthority.js"
      - "ai/MovieMentorProviderOperationMongoStore.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/MovieMentorRecoveredSemanticResult.js"
      - "ai/MovieMentorRecoveredTaskResult.js"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check provider historical-input authority syntax
        run: |
          node --check ai/MovieMentorRecoveredProviderResultAuthority.js
          node --check ai/MovieMentorProviderOperationAuthority.js
          node --check ai/MovieMentorProviderOperationMongoStore.js
          node --check ai/MovieMentorTurnRuntime.js
          node --check scripts/verify-movie-mentor-provider-historical-input-authority.mjs
      - name: Verify provider historical-input authority
        run: node scripts/verify-movie-mentor-provider-historical-input-authority.mjs
