name: Verify Movie Mentor Policy Authorization Provenance Authority

on:
  push:
    branches:
      - verify-movie-mentor-policy-authorization-provenance-authority
  pull_request:
    branches:
      - verify-movie-mentor-policy-decision-ingress-authority

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 21
      - run: node scripts/verify-movie-mentor-policy-authorization-provenance-authority.mjs
