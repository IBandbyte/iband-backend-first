name: Verify Movie Mentor Canonical Candidate Provenance Authority
on:
  pull_request:
    paths:
      - "ai/MovieMentorCanonicalResultMongoStore.js"
      - "scripts/verify-movie-mentor-canonical-candidate-provenance-authority.mjs"
      - ".github/workflows/verify-movie-mentor-canonical-candidate-provenance-authority.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Syntax check canonical candidate provenance authority
        run: |
          node --check ai/MovieMentorCanonicalResultMongoStore.js
          node --check scripts/verify-movie-mentor-canonical-candidate-provenance-authority.mjs
      - name: Verify canonical candidate provenance authority
        run: node scripts/verify-movie-mentor-canonical-candidate-provenance-authority.mjs
