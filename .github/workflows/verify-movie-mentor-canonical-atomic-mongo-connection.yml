name: Verify Movie Mentor Canonical Atomic Mongo Connection

on:
  workflow_dispatch:
  push:
    branches:
      - verify/creator-atomic-production-mount-court-20261104
    paths:
      - ".github/workflows/verify-movie-mentor-canonical-atomic-mongo-connection.yml"
      - "scripts/verify-movie-mentor-canonical-atomic-mongo-connection.mjs"
      - "ai/MovieMentorCreatorStateCanonicalMongoConnection.js"

jobs:
  verify-canonical-atomic-mongo-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check provenance court
        run: node --check scripts/verify-movie-mentor-canonical-atomic-mongo-connection.mjs
      - name: Run canonical Mongo provenance court
        run: node scripts/verify-movie-mentor-canonical-atomic-mongo-connection.mjs
