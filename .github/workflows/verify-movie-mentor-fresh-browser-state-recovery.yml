name: Verify Movie Mentor Fresh Browser Creator State Recovery
on:
  push:
    branches:
      - verify/creator-state-fresh-browser-recovery-20261031
  workflow_dispatch:
jobs:
  verify-fresh-browser-recovery:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_recovery_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated HTTP test dependencies
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm install --no-save --no-audit --no-fund --ignore-scripts mongodb-memory-server@10
      - name: Syntax check recovery verifiers and handler
        run: |
          node --check scripts/verify-movie-mentor-fresh-browser-state-recovery.mjs
          node --check scripts/verify-movie-mentor-creator-state-recovery-security.mjs
          node --check ai/MovieMentorCreatorStateRecoveryHandler.js
          node --check scripts/verify-movie-mentor-recovery-http-transport.mjs
          node --check scripts/verify-movie-mentor-recovery-mongodb-http.mjs
          node --check scripts/verify-movie-mentor-recovery-isolated-mongodb-http.mjs
      - name: Verify creator state recovery security and safe exposure
        run: node scripts/verify-movie-mentor-creator-state-recovery-security.mjs
      - name: Verify authenticated HTTP recovery transport
        run: node scripts/verify-movie-mentor-recovery-http-transport.mjs
      - name: Verify disposable physical MongoDB authorized HTTP recovery
        env:
          MONGO_URI: ""
          MONGODB_URI: ""
        run: node scripts/verify-movie-mentor-recovery-isolated-mongodb-http.mjs
      - name: Verify isolated MongoDB persistence and authorized HTTP recovery
        run: node scripts/verify-movie-mentor-recovery-mongodb-http.mjs
      - name: Verify creator state recovery read contract
        run: node scripts/verify-movie-mentor-fresh-browser-state-recovery.mjs
