name: Verify Movie Mentor Late Local Authority Characterization
on:
  push:
    branches:
      - verify/creator-atomic-production-mount-court-20261104
  workflow_dispatch:
jobs:
  late-local-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false mongoose
      - run: docker run -d --rm --name mm-late-local-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
      - run: |
          for i in $(seq 1 40); do
            if docker exec mm-late-local-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mm-late-local-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          sleep 3
      - run: node scripts/verify-movie-mentor-late-local-authority-characterization.mjs
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_isolated_late_local?replicaSet=rs0&directConnection=true
