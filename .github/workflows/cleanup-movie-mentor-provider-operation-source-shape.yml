name: Cleanup Movie Mentor Provider Operation Source Shape

on:
  push:
    branches:
      - round-seven-provider-operation-network-identity-authority
    paths:
      - ".github/workflows/cleanup-movie-mentor-provider-operation-source-shape.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore clean source shape and reapply proven behavior
        shell: bash
        run: |
          set -euo pipefail
          BASE=e3fe87bf32f2dbb180e1e8293373b7b171dc5909
          git show "$BASE:ai/MovieMentorTurnRuntime.js" > ai/MovieMentorTurnRuntime.js
          git show "$BASE:ai/MovieMentorSpecialistExecutor.js" > ai/MovieMentorSpecialistExecutor.js
          git show "$BASE:ai/MovieMentorContinuityAgent.js" > ai/MovieMentorContinuityAgent.js
          echo '' | base64 -d > /tmp/cleanup-provider-operation.js
          node /tmp/cleanup-provider-operation.js
          node --check ai/MovieMentorTurnRuntime.js
          node --check ai/MovieMentorSpecialistExecutor.js
          node --check ai/MovieMentorContinuityAgent.js
          git rm .github/workflows/cleanup-movie-mentor-provider-operation-source-shape.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/MovieMentorTurnRuntime.js ai/MovieMentorSpecialistExecutor.js ai/MovieMentorContinuityAgent.js
          git commit -m "Restore clean provider operation authority source shape"
          git push origin HEAD:round-seven-provider-operation-network-identity-authority
