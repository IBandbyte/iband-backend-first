name: Verify Movie Mentor Unpaid Completed Checkout Discovery

on:
  pull_request:
    paths:
      - "ai/MovieMentorCommercialCheckoutBindingMongoStore.js"
      - "scripts/verify-movie-mentor-unpaid-completed-checkout-discovery.mjs"
      - ".github/workflows/verify-movie-mentor-unpaid-completed-checkout-discovery.yml"
  workflow_dispatch:

jobs:
  verify-unpaid-completed-checkout-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify unpaid completed checkout discovery
        run: node scripts/verify-movie-mentor-unpaid-completed-checkout-discovery.mjs
