name: Verify Movie Mentor Current Execution Closure Authority
on:
  pull_request:
    paths:
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "ai/MovieMentorInferenceExecutionClosureAuthority.js"
      - "scripts/verify-movie-mentor-current-execution-closure-authority.mjs"
      - ".github/workflows/verify-movie-mentor-current-execution-closure-authority.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Syntax check current execution closure authority
        run: |
          node --check ai/MovieMentorInferenceExecutionMongoStore.js
          node --check ai/MovieMentorInferenceExecutionClosureAuthority.js
          node --check scripts/verify-movie-mentor-current-execution-closure-authority.mjs
      - name: Verify current execution closure authority
        run: node scripts/verify-movie-mentor-current-execution-closure-authority.mjs
