name: Verify Movie Mentor Active Staged Candidate Takeover Convergence

on:
  pull_request:
    branches:
      - verify-provider-reconstruction-input-takeover-serialization
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-active-staged-candidate-takeover-convergence.mjs
