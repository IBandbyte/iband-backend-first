name: Verify Movie Mentor Gates of Execution Fence Reissuance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "scripts/verify-movie-mentor-execution-fence-reissuance.mjs"
      - ".github/workflows/verify-movie-mentor-execution-fence-reissuance.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node --check ai/MovieMentorInferenceExecutionLeaseAuthority.js
      - run: node --check scripts/verify-movie-mentor-execution-fence-reissuance.mjs
      - run: node scripts/verify-movie-mentor-execution-fence-reissuance.mjs
