name: Verify Movie Mentor Legacy Settlement Execution Write Authority
on:
  push:
    branches: [verify-legacy-settlement-execution-write-authority]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check scripts/verify-movie-mentor-legacy-settlement-execution-write-authority.mjs
      - run: node scripts/verify-movie-mentor-legacy-settlement-execution-write-authority.mjs
