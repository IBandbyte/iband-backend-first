name: Verify Movie Mentor Provider Operation Physical Authority

on:
  push:
    branches:
      - movie-mentor-provider-operation-physical-authority
    paths:
      - "ai/MovieMentorProviderOperationMongoStore.js"
      - "ai/MovieMentorProviderOperationAuthority.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "scripts/verify-movie-mentor-provider-operation-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-operation-physical-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorProviderOperationMongoStore.js"
      - "ai/MovieMentorProviderOperationAuthority.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "scripts/verify-movie-mentor-provider-operation-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-operation-physical-authority.yml"
  workflow_dispatch:

jobs:
  verify-provider-operation-physical-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-movie-mentor-provider-operation-physical-authority.mjs
