name: Verify Movie Mentor Inference Execution Lease Cross-Clock Authority
on:
  push:
    branches:
      - verify-inference-execution-lease-cross-clock-authority
  pull_request:
    paths:
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "scripts/verify-movie-mentor-inference-execution-lease-cross-clock-authority.mjs"
      - ".github/workflows/verify-movie-mentor-inference-execution-lease-cross-clock-authority.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/verify-movie-mentor-inference-execution-lease-cross-clock-authority.mjs
