name: Verify Movie Mentor Predispatch Admitted Slot Reconciliation Authority

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/MovieMentorProviderOutcomeRecoveryAuthority.js"
      - "ai/MovieMentorInferenceSettlementMongoStore.js"
      - "scripts/verify-movie-mentor-predispatch-admitted-slot-reconciliation-authority.mjs"
      - ".github/workflows/verify-movie-mentor-predispatch-admitted-slot-reconciliation-authority.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-predispatch-admitted-slot-reconciliation-authority.mjs
