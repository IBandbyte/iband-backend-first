name: Verify Movie Mentor Continuity Cache Index Provisioning Authority
on:
  push:
    paths:
      - "ai/MovieMentorContinuityDerivedCacheStore.js"
      - "scripts/verify-movie-mentor-continuity-cache-index-provisioning-authority.mjs"
      - ".github/workflows/verify-movie-mentor-continuity-cache-index-provisioning-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorContinuityDerivedCacheStore.js"
      - "scripts/verify-movie-mentor-continuity-cache-index-provisioning-authority.mjs"
      - ".github/workflows/verify-movie-mentor-continuity-cache-index-provisioning-authority.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: node --check ai/MovieMentorContinuityDerivedCacheStore.js
      - run: node --check scripts/verify-movie-mentor-continuity-cache-index-provisioning-authority.mjs
      - run: node scripts/verify-movie-mentor-continuity-cache-index-provisioning-authority.mjs
