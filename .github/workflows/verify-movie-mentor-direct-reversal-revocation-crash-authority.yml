name: Verify Movie Mentor Direct Reversal Revocation Crash Authority
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorCommercialReversalAuthority.js"
      - "ai/MovieMentorCommercialProviderIngressAuthority.js"
      - "scripts/verify-movie-mentor-direct-reversal-revocation-crash-authority.mjs"
      - ".github/workflows/verify-movie-mentor-direct-reversal-revocation-crash-authority.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check scripts/verify-movie-mentor-direct-reversal-revocation-crash-authority.mjs
      - run: node scripts/verify-movie-mentor-direct-reversal-revocation-crash-authority.mjs
