name: Verify Movie Mentor Journey Recovery Production Exposure Authority

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check production exposure authority
        run: node --check ai/MovieMentorJourneyRecoveryProductionExposureAuthority.js

      - name: Syntax check production exposure authority torture
        run: node --check scripts/verify-movie-mentor-journey-recovery-production-exposure-authority.mjs

      - name: Verify production exposure authority
        run: node scripts/verify-movie-mentor-journey-recovery-production-exposure-authority.mjs
