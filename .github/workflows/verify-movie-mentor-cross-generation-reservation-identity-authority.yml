name: Verify Movie Mentor Cross-Generation Reservation Identity Authority

on:
  push:
    paths:
      - "ai/MovieMentorInferenceSpendMongoStore.js"
      - "scripts/verify-movie-mentor-cross-generation-reservation-identity-authority.mjs"
      - ".github/workflows/verify-movie-mentor-cross-generation-reservation-identity-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorInferenceSpendMongoStore.js"
      - "scripts/verify-movie-mentor-cross-generation-reservation-identity-authority.mjs"
      - ".github/workflows/verify-movie-mentor-cross-generation-reservation-identity-authority.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Syntax check
        run: node --check scripts/verify-movie-mentor-cross-generation-reservation-identity-authority.mjs
      - name: Verify cross-generation reservation identity authority
        run: node scripts/verify-movie-mentor-cross-generation-reservation-identity-authority.mjs
