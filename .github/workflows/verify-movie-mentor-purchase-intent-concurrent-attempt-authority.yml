name: Verify Movie Mentor Purchase Intent Concurrent Attempt Authority

on:
  pull_request:
    paths:
      - 'ai/MovieMentorCommercialPurchaseIntentAuthority.js'
      - 'ai/MovieMentorCommercialPurchaseIntentMongoStore.js'
      - 'scripts/verify-movie-mentor-purchase-intent-concurrent-attempt-authority.mjs'
      - '.github/workflows/verify-movie-mentor-purchase-intent-concurrent-attempt-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check scripts/verify-movie-mentor-purchase-intent-concurrent-attempt-authority.mjs
      - run: node scripts/verify-movie-mentor-purchase-intent-concurrent-attempt-authority.mjs
