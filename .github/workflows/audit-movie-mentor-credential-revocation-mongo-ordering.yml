name: Audit Movie Mentor Credential Revocation Mongo Ordering
on:
  push:
    branches:
      - audit/creator-revocation-policy-20261107
  workflow_dispatch:
jobs:
  physical-credential-revocation-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact head and preserve original RED
        shell: bash
        run: |
          set -euo pipefail
          echo "AUDIT_SHA=$(git rev-parse HEAD)"
          git cat-file -e 7188ef1a300b9df30e3a460945963de81c84c74d^{commit}
          git diff --exit-code 7188ef1a300b9df30e3a460945963de81c84c74d HEAD -- scripts/verify-movie-mentor-creator-state-mongo-postcheck-revocation.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated court dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Start disposable MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0
      - name: Run physical credential revocation ordering court
        env:
          MOVIE_MENTOR_ISOLATED_MONGO_URI: mongodb://127.0.0.1:27017/movie_mentor_credential_revocation_physical?replicaSet=rs0&directConnection=true
        run: node scripts/verify-movie-mentor-credential-revocation-mongo-ordering.mjs
