name: Verify Movie Mentor Inference Execution Index Readiness

on:
  pull_request:
    paths:
      - "ai/MovieMentorInferenceExecutionMongoStore.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "scripts/verify-movie-mentor-inference-execution-index-readiness.mjs"
      - ".github/workflows/verify-movie-mentor-inference-execution-index-readiness.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-movie-mentor-inference-execution-index-readiness.mjs
