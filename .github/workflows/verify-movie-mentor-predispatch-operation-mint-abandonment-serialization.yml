name: Verify Movie Mentor Predispatch Operation Mint Abandonment Serialization
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ai/MovieMentorProviderOperationMongoStore.js"
      - "ai/MovieMentorProviderOperationAuthority.js"
      - "ai/MovieMentorProviderEffectMongoStore.js"
      - "ai/MovieMentorInferenceSettlementMongoStore.js"
      - "scripts/verify-movie-mentor-predispatch-operation-mint-abandonment-serialization.mjs"
      - ".github/workflows/verify-movie-mentor-predispatch-operation-mint-abandonment-serialization.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-predispatch-operation-mint-abandonment-serialization.mjs
