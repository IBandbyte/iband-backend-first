name: Verify Movie Mentor Legacy Migration Issuance Physical Authority

on:
  push:
    paths:
      - "ai/MovieMentorLegacyMigrationAttestationIssuanceStore.js"
      - "ai/MovieMentorLegacyMigrationCeremony.js"
      - "scripts/verify-movie-mentor-legacy-migration-issuance-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-legacy-migration-issuance-physical-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorLegacyMigrationAttestationIssuanceStore.js"
      - "ai/MovieMentorLegacyMigrationCeremony.js"
      - "scripts/verify-movie-mentor-legacy-migration-issuance-physical-authority.mjs"
      - ".github/workflows/verify-movie-mentor-legacy-migration-issuance-physical-authority.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify physical issuance authority
        run: node scripts/verify-movie-mentor-legacy-migration-issuance-physical-authority.mjs
