name: Verify Movie Mentor Historical Result Re-Exposure Authority

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "movieMentorTurn.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-historical-result-re-exposure-authority.mjs"
      - ".github/workflows/verify-movie-mentor-historical-result-re-exposure-authority.yml"
  push:
    branches: [main]
    paths:
      - "movieMentorTurn.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-historical-result-re-exposure-authority.mjs"
      - ".github/workflows/verify-movie-mentor-historical-result-re-exposure-authority.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check historical result re-exposure authority syntax
        run: |
          node --check movieMentorTurn.js
          node --check ai/MovieMentorTurnRuntime.js
          node --check scripts/verify-movie-mentor-historical-result-re-exposure-authority.mjs
      - name: Verify historical result re-exposure authority
        run: node scripts/verify-movie-mentor-historical-result-re-exposure-authority.mjs
