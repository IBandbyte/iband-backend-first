name: Verify Movie Mentor Recovery Activation Lease Return Binding Authority
on:
  push:
    branches: [verify-recovery-activation-lease-return-binding-authority]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check scripts/verify-movie-mentor-recovery-activation-lease-return-binding-authority.mjs
      - run: node scripts/verify-movie-mentor-recovery-activation-lease-return-binding-authority.mjs
