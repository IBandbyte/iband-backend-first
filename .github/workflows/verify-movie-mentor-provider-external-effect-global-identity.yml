name: Verify Movie Mentor Provider External Effect Global Identity
on:
  push:
    paths: ["ai/MovieMentorProviderEffectMongoStore.js","scripts/verify-movie-mentor-provider-external-effect-global-identity.mjs",".github/workflows/verify-movie-mentor-provider-external-effect-global-identity.yml"]
  pull_request:
    paths: ["ai/MovieMentorProviderEffectMongoStore.js","scripts/verify-movie-mentor-provider-external-effect-global-identity.mjs",".github/workflows/verify-movie-mentor-provider-external-effect-global-identity.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://localhost:27017/iband_external_effect_identity?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Start transactional Mongo
        run: |
          docker run -d --name mongo7 -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for i in {1..30}; do docker exec mongo7 mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break; sleep 1; done
          docker exec mongo7 mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in {1..30}; do docker exec mongo7 mongosh --quiet --eval 'if (rs.status().myState === 1) quit(0); quit(1)' >/dev/null 2>&1 && break; sleep 1; done
      - run: node scripts/verify-movie-mentor-provider-external-effect-global-identity.mjs
