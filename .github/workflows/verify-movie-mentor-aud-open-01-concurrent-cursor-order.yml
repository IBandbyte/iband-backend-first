          node-version: "20"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Inventory exact-head recovery consumers (verifier-only)
        run: node scripts/verify-movie-mentor-aud-open-01-consumer-inventory.mjs
      - name: Inventory exact-head settlement authority callers (verifier-only)
        run: node scripts/verify-movie-mentor-aud-open-01-settlement-caller-inventory.mjs
