      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        command: mongod --replSet rs0 --bind_ip_all --setParameter enableTestCommands=1
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/iband_aud_open_01?directConnection=true
