        run: node scripts/verify-movie-mentor-aud-open-01-replay-design-model.mjs
      # Dependency installation and replica-set election must succeed before any physical court.
      - name: Initialize replica set
        run: |
          docker exec ${{ job.services.mongo.id }} mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.mongo.id }} mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          exit 1
