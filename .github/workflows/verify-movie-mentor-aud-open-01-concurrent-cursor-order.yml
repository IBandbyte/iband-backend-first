name: Verify Movie Mentor AUD-OPEN-01 Concurrent Cursor Order
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        command: mongod --replSet rs0 --bind_ip_all
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/iband_aud_open_01?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Initialize replica set
        run: |
          docker exec ${{ job.services.mongo.id }} mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.mongo.id }} mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify financial cursor lifecycle with genuine ledger
        run: node scripts/verify-movie-mentor-aud-open-01-financial-cursor-lifecycle.mjs
      - name: Reset isolated database after financial court
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Verify signed Stripe ingress first-failure retry boundary
        run: node scripts/verify-movie-mentor-aud-open-01-signed-ingress-retry.mjs
      - name: Reset isolated database after signed ingress retry court
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Verify dual signed Stripe ingress independent retry baseline
        run: node scripts/verify-movie-mentor-aud-open-01-dual-signed-ingress-baseline.mjs
      - name: Reset isolated database after dual ingress baseline
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Verify production-generated reversal ID commit order
        run: node scripts/verify-movie-mentor-aud-open-01-production-id-order.mjs
      - name: Reset isolated verifier database between independent courts
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Verify original isolated cursor-order scenario
        if: always()
        run: node scripts/verify-movie-mentor-aud-open-01-concurrent-cursor-order.mjs
