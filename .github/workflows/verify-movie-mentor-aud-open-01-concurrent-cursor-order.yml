name: Verify Movie Mentor AUD-OPEN-01 Concurrent Cursor Order
# Audit-only CI retrigger: rerun the owner-return repair against this exact head.
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        command: mongod --replSet rs0 --bind_ip_all --setParameter enableTestCommands=1
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/iband_aud_open_01?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Inventory exact-head recovery consumers (verifier-only)
        run: node scripts/verify-movie-mentor-aud-open-01-consumer-inventory.mjs
      - name: Inventory exact-head settlement authority callers (verifier-only)
        run: node scripts/verify-movie-mentor-aud-open-01-settlement-caller-inventory.mjs
      - name: Inventory exact-head settlement return paths (verifier-only)
        run: node scripts/verify-movie-mentor-aud-open-01-return-path-inventory.mjs
      - name: Verify late-commit liveness constraint (verifier-only)
        run: node scripts/verify-movie-mentor-aud-open-01-late-commit-liveness-constraint.mjs
      - name: Verify late-commit replay design model (verifier-only)
        run: node scripts/verify-movie-mentor-aud-open-01-replay-design-model.mjs
      - run: npm install --ignore-scripts --no-audit --no-fund
      # Dependency installation and replica-set election must succeed before any physical court.
      - name: Initialize replica set
        run: |
          docker exec ${{ job.services.mongo.id }} mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.mongo.id }} mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify no-failure late-commit bounded no-trigger control
        if: success() || failure()
        run: node scripts/verify-movie-mentor-aud-open-01-no-failure-late-commit-control.mjs
      - name: Reset isolated database after no-failure late-commit control
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Verify post-completion late-commit no-trigger control
        if: success() || failure()
        run: node scripts/verify-movie-mentor-aud-open-01-post-completion-late-commit-control.mjs
      - name: Reset isolated database after post-completion late-commit control
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Verify restart recovery of late-committed chargeback
        if: success() || failure()
        run: node scripts/verify-movie-mentor-aud-open-01-restart-recovery.mjs
      - name: Reset isolated database after restart recovery
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Verify financial cursor lifecycle with genuine ledger
        if: success() || failure()
        run: node scripts/verify-movie-mentor-aud-open-01-financial-cursor-lifecycle.mjs
      - name: Reset isolated database after financial court
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Demand physical owner-return contract (expected RED)
        if: success() || failure()
        run: node scripts/verify-movie-mentor-aud-open-01-physical-owner-return-contract.mjs
      - name: Reset isolated database after owner-return contract
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Verify isolated bounded full-replay candidate with concurrent workers
        if: success() || failure()
        run: node scripts/verify-movie-mentor-aud-open-01-isolated-bounded-replay-candidate.mjs
      - name: Reset isolated database after bounded replay candidate
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Verify isolated post-scan no-trigger settlement window
        if: success() || failure()
        run: node scripts/verify-movie-mentor-aud-open-01-post-scan-no-trigger-window.mjs
      - name: Reset isolated database before no-alarm contract court
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Demand autonomous late-commit recovery without any alarm (expected RED)
        if: success() || failure()
        run: node scripts/verify-movie-mentor-aud-open-01-no-alarm-contract-red.mjs
      - name: Reset isolated database after post-scan no-trigger court
        if: always()
        run: docker exec ${{ job.services.mongo.id }} mongosh --quiet iband_aud_open_01 --eval 'db.dropDatabase()'
      - name: Verify overlapping financial recovery scans
