name: Verify Movie Mentor Journey Recovery Express Router Factory

on:
  push:
    paths:
      - "ai/MovieMentorJourneyRecoveryExpressRouterFactory.js"
      - "ai/MovieMentorJourneyRecoveryHttpTransportAdapter.js"
      - "ai/MovieMentorJourneyRecoveryPublicationBoundary.js"
      - "ai/MovieMentorJourneyRecoveryRequestAuthority.js"
      - "ai/MovieMentorDeterministicPrincipalAdapter.js"
      - "ai/MovieMentorJourneyRecoveryAuthorizationBoundary.js"
      - "ai/MovieMentorProjectOwnershipRegistry.js"
      - "ai/MovieMentorJourneyRecoveryEnvelope.js"
      - "ai/MovieMentorJourneyRecoveryTransition.js"
      - "ai/MovieMentorJourneyRecoveryStore.js"
      - "scripts/verify-movie-mentor-journey-recovery-express-router-factory.mjs"
      - "package.json"
      - ".github/workflows/verify-movie-mentor-journey-recovery-express-router-factory.yml"
  pull_request:
    paths:
      - "ai/MovieMentorJourneyRecoveryExpressRouterFactory.js"
      - "ai/MovieMentorJourneyRecoveryHttpTransportAdapter.js"
      - "ai/MovieMentorJourneyRecoveryPublicationBoundary.js"
      - "ai/MovieMentorJourneyRecoveryRequestAuthority.js"
      - "ai/MovieMentorDeterministicPrincipalAdapter.js"
      - "ai/MovieMentorJourneyRecoveryAuthorizationBoundary.js"
      - "ai/MovieMentorProjectOwnershipRegistry.js"
      - "ai/MovieMentorJourneyRecoveryEnvelope.js"
      - "ai/MovieMentorJourneyRecoveryTransition.js"
      - "ai/MovieMentorJourneyRecoveryStore.js"
      - "scripts/verify-movie-mentor-journey-recovery-express-router-factory.mjs"
      - "package.json"
      - ".github/workflows/verify-movie-mentor-journey-recovery-express-router-factory.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Syntax check Express router factory
        run: node --check ai/MovieMentorJourneyRecoveryExpressRouterFactory.js

      - name: Run Express router factory torture
        run: node scripts/verify-movie-mentor-journey-recovery-express-router-factory.mjs
