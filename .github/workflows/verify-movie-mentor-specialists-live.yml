name: Verify Movie Mentor Live Specialist Isolation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-movie-mentor-specialists-live.yml"
      - "scripts/verify-movie-mentor-specialists-live.mjs"
      - "movieMentorSpecialists.js"
      - "server.js"

permissions:
  contents: read

jobs:
  live-specialist-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Wait for Render deployment to settle
        run: sleep 75
      - name: Verify standalone specialist routes are not public
        continue-on-error: true
        env:
          IBAND_LIVE_BACKEND_URL: https://iband-backend-first-1.onrender.com
          IBAND_LIVE_REPORT_PATH: verification-results/movie-mentor-specialists-live.json
        run: node scripts/verify-movie-mentor-specialists-live.mjs
      - name: Enforce live isolation result
        run: |
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("verification-results/movie-mentor-specialists-live.json","utf8")); console.log(JSON.stringify(r,null,2)); if(!r.passed || !r.publiclyIsolated) process.exit(1);'
