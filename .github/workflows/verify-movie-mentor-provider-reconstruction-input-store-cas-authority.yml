name: Verify Movie Mentor Provider Reconstruction Input Store CAS Authority

on:
  pull_request:
    paths:
      - 'ai/MovieMentorProviderOperationMongoStore.js'
      - 'scripts/verify-movie-mentor-provider-reconstruction-input-store-cas-authority.mjs'
      - '.github/workflows/verify-movie-mentor-provider-reconstruction-input-store-cas-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify provider reconstruction input store CAS authority
        run: node scripts/verify-movie-mentor-provider-reconstruction-input-store-cas-authority.mjs
