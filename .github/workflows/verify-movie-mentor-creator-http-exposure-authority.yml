name: Verify Movie Mentor Creator HTTP Exposure Authority
on:
  push:
    branches: [main]
    paths:
      - "movieMentorTurn.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-creator-http-exposure-authority.mjs"
      - ".github/workflows/verify-movie-mentor-creator-http-exposure-authority.yml"
  pull_request:
    branches: [main]
    paths:
      - "movieMentorTurn.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-creator-http-exposure-authority.mjs"
      - ".github/workflows/verify-movie-mentor-creator-http-exposure-authority.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check creator HTTP exposure authority syntax
        run: node --check movieMentorTurn.js && node --check scripts/verify-movie-mentor-creator-http-exposure-authority.mjs
      - name: Verify creator HTTP exposure authority
        run: node scripts/verify-movie-mentor-creator-http-exposure-authority.mjs
