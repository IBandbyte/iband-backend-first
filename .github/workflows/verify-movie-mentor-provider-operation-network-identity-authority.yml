name: Verify Movie Mentor Provider Operation Network Identity Authority

on:
  pull_request:
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/StructuredAIProviderClient.js"
      - "ai/MovieMentorSemanticInterpreter.js"
      - "ai/MovieMentorSpecialistExecutor.js"
      - "ai/MovieMentorContinuityAgent.js"
      - "ai/MovieMentorSynthesisEngine.js"
      - "scripts/verify-movie-mentor-provider-operation-network-identity-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-operation-network-identity-authority.yml"
  push:
    branches: [main]
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "ai/StructuredAIProviderClient.js"
      - "ai/MovieMentorSemanticInterpreter.js"
      - "ai/MovieMentorSpecialistExecutor.js"
      - "ai/MovieMentorContinuityAgent.js"
      - "ai/MovieMentorSynthesisEngine.js"
      - "scripts/verify-movie-mentor-provider-operation-network-identity-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-operation-network-identity-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check provider operation network identity authority syntax
        run: |
          node --check ai/MovieMentorTurnRuntime.js
          node --check ai/StructuredAIProviderClient.js
          node --check ai/MovieMentorSemanticInterpreter.js
          node --check ai/MovieMentorSpecialistExecutor.js
          node --check ai/MovieMentorContinuityAgent.js
          node --check ai/MovieMentorSynthesisEngine.js
          node --check scripts/verify-movie-mentor-provider-operation-network-identity-authority.mjs
      - name: Verify provider operation network identity authority
        run: node scripts/verify-movie-mentor-provider-operation-network-identity-authority.mjs
