name: Verify Movie Mentor Provider Dispatch Post-Proof Creator-State Race Authority

on:
  push:
    branches:
      - verify-provider-dispatch-post-proof-creator-state-race
  pull_request:
    branches:
      - verify-legacy-zero-first-compensation-transition-race
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-movie-mentor-provider-dispatch-post-proof-creator-state-race-authority.mjs
