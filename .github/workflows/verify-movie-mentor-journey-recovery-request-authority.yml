name: Verify Movie Mentor Journey Recovery Request Authority

on:
  push:
    paths:
      - 'ai/MovieMentorJourneyRecoveryRequestAuthority.js'
      - 'ai/MovieMentorDeterministicPrincipalAdapter.js'
      - 'ai/MovieMentorJourneyRecoveryAuthorizationBoundary.js'
      - 'ai/MovieMentorProjectOwnershipRegistry.js'
      - 'scripts/verify-movie-mentor-journey-recovery-request-authority.mjs'
      - '.github/workflows/verify-movie-mentor-journey-recovery-request-authority.yml'
  pull_request:
    paths:
      - 'ai/MovieMentorJourneyRecoveryRequestAuthority.js'
      - 'ai/MovieMentorDeterministicPrincipalAdapter.js'
      - 'ai/MovieMentorJourneyRecoveryAuthorizationBoundary.js'
      - 'ai/MovieMentorProjectOwnershipRegistry.js'
      - 'scripts/verify-movie-mentor-journey-recovery-request-authority.mjs'
      - '.github/workflows/verify-movie-mentor-journey-recovery-request-authority.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Torture deterministic recovery request authority
        run: node scripts/verify-movie-mentor-journey-recovery-request-authority.mjs
