name: Verify Movie Mentor Closure Frozen Universe Digest Authority
on:
  push:
    branches: [verify-closure-frozen-universe-digest-authority]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: node scripts/verify-movie-mentor-closure-frozen-universe-digest-authority.mjs
