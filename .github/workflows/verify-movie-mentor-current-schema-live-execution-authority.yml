name: Verify Movie Mentor Current Schema Live Execution Authority
on:
  pull_request:
    paths:
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "scripts/verify-movie-mentor-current-schema-live-execution-authority.mjs"
      - ".github/workflows/verify-movie-mentor-current-schema-live-execution-authority.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check ai/MovieMentorInferenceExecutionLeaseAuthority.js
      - run: node --check scripts/verify-movie-mentor-current-schema-live-execution-authority.mjs
      - run: node scripts/verify-movie-mentor-current-schema-live-execution-authority.mjs
