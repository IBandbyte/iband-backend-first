name: Verify Movie Mentor Provider Evidence Operation Binding Authority

on:
  push:
    paths:
      - "ai/MovieMentorProviderEffectAuthority.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-provider-evidence-operation-binding-authority.mjs"
      - "scripts/verify-movie-mentor-provider-evidence-operation-binding-backend-ci-authority.mjs"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/verify-movie-mentor-provider-evidence-operation-binding-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorProviderEffectAuthority.js"
      - "ai/MovieMentorProductionInferenceExecutionComposition.js"
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-provider-evidence-operation-binding-authority.mjs"
      - "scripts/verify-movie-mentor-provider-evidence-operation-binding-backend-ci-authority.mjs"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/verify-movie-mentor-provider-evidence-operation-binding-authority.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check ai/MovieMentorProviderEffectAuthority.js
      - run: node --check ai/MovieMentorProductionInferenceExecutionComposition.js
      - run: node --check scripts/verify-movie-mentor-provider-evidence-operation-binding-authority.mjs
      - run: node --check scripts/verify-movie-mentor-provider-evidence-operation-binding-backend-ci-authority.mjs
      - run: node scripts/verify-movie-mentor-provider-evidence-operation-binding-authority.mjs
      - run: node scripts/verify-movie-mentor-provider-evidence-operation-binding-backend-ci-authority.mjs
