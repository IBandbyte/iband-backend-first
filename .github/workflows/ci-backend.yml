        run: npm run verify:movie-mentor-operations-replay-proof
      - name: Verify Movie Mentor Operations atomic freshness
        run: npm run verify:movie-mentor-operations-atomic-freshness
      - name: Verify Movie Mentor Operations scope isolation
        run: npm run verify:movie-mentor-operations-scope
      - name: Verify Movie Mentor Operations runtime origin attestation
        run: npm run verify:movie-mentor-operations-runtime-origin
      - name: Verify Movie Mentor Operations reality evidence
        run: npm run verify:movie-mentor-operations-reality
      - name: Verify Movie Mentor Operations mutation capability power boundary
        run: npm run verify:movie-mentor-operations-power
      - name: Verify Movie Mentor creator work custody soul boundary
        run: npm run verify:movie-mentor-operations-soul
      - name: Verify Movie Mentor concurrent creator revision barrier
        run: npm run verify:movie-mentor-creator-revision-barrier
      - name: Verify Movie Mentor multi-device creator branch convergence
        run: npm run verify:movie-mentor-creator-branch-convergence
      - name: Verify Movie Mentor Infinity Gauntlet integration
        run: npm run verify:movie-mentor-operations-gauntlet
      - name: Verify Movie Mentor atomic Gauntlet mutation boundary
        run: npm run verify:movie-mentor-operations-atomic-gauntlet
      - name: Verify Movie Mentor distributed effect reconciliation
        run: npm run verify:movie-mentor-operations-distributed-effects
      - name: Verify Movie Mentor reconciliation lease split-brain fencing
        run: npm run verify:movie-mentor-operations-reconciliation-lease
      - name: Verify Movie Mentor lease authority quorum
        run: npm run verify:movie-mentor-operations-lease-authority-quorum
      - name: Verify Movie Mentor authority re-entry convergence
        run: npm run verify:movie-mentor-operations-authority-reentry
      - name: Verify Movie Mentor recovery anti-flapping stability
        run: npm run verify:movie-mentor-operations-recovery-stability
      - name: Verify permanent Recovery Catastrophe Regression Matrix
