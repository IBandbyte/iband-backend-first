name: CI (Backend)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check server syntax
        run: node --check server.js
      - name: Check Movie Mentor gateways and engines
        run: node --check movieMentorSemantic.js && node --check movieMentorSpecialists.js && node --check movieMentorSynthesis.js && node --check ai/MovieMentorSemanticInterpreter.js && node --check ai/StructuredAIProviderClient.js && node --check ai/MovieMentorSpecialistExecutor.js && node --check ai/MovieMentorSynthesisEngine.js
      - name: Check Movie Mentor Operations control-plane syntax
        run: >-
          node --check ai/MovieMentorCanonicalAgentRegistry.js &&
          node --check ai/MovieMentorAgentAdmissionQuarantineControl.js &&
          node --check ai/MovieMentorAgentHealthIntegrityAgent.js &&
          node --check ai/MovieMentorOperationsSupervisor.js &&
          node --check ai/MovieMentorOperationsSupervisorAgent.js &&
          node --check ai/MovieMentorOperationsControlPlane.js &&
          node --check ai/MovieMentorOperationsStateMachine.js &&
          node --check ai/MovieMentorOperationsAuditIncidentLedger.js &&
          node --check ai/MovieMentorOperationsReplayFreshnessControl.js &&
          node --check ai/MovieMentorOperationsReplayProofControl.js &&
          node --check ai/MovieMentorOperationsAtomicFreshnessGate.js &&
          node --check ai/MovieMentorOperationsScopeIsolationControl.js &&
          node --check ai/MovieMentorOperationsRuntimeOriginAttestation.js &&
          node --check ai/MovieMentorOperationsRealityEvidenceControl.js &&
          node --check ai/MovieMentorOperationsMutationCapabilityControl.js &&
          node --check ai/MovieMentorCreatorBranchConvergenceControl.js &&
          node --check ai/MovieMentorCreatorRevisionBarrierControl.js &&
          node --check ai/MovieMentorCreatorWorkCustodyControl.js &&
          node --check ai/MovieMentorOperationsInfinityGauntlet.js &&
          node --check ai/MovieMentorOperationsAtomicGauntletMutationGate.js &&
          node --check ai/MovieMentorOperationsDistributedEffectReconciliation.js &&
          node --check ai/MovieMentorOperationsReconciliationLeaseControl.js &&
          node --check ai/MovieMentorOperationsLeaseAuthorityQuorumControl.js &&
          node --check ai/MovieMentorOperationsAuthorityReentryGate.js &&
          node --check ai/MovieMentorOperationsRecoveryStabilityControl.js &&
          node --check ai/MovieMentorPostCatastropheRecoveryCertification.js &&
          node --check ai/MovieMentorControlledRecoveryExecutor.js &&
          node --check ai/MovieMentorControlledRollbackExecutor.js &&
          node --check ai/MovieMentorRecoveryVerificationAgent.js &&
          node --check ai/MovieMentorPostRollbackVerificationAgent.js &&
          node --check ai/MovieMentorCreatorStateEmergencyPreservation.js &&
          node --check ai/MovieMentorExternalOperationsWatchdog.js &&
          node --check ai/MovieMentorRecoveryObjectivesPolicy.js &&
          node --check ai/MovieMentorOperationsFailureDrillControl.js &&
          node --check scripts/verify-movie-mentor-operations-v2.mjs &&
          node --check scripts/verify-movie-mentor-operations-warp40.mjs &&
          node --check scripts/verify-movie-mentor-operations-replay.mjs &&
          node --check scripts/verify-movie-mentor-operations-replay-proof.mjs &&
          node --check scripts/verify-movie-mentor-operations-atomic-freshness.mjs &&
          node --check scripts/verify-movie-mentor-operations-scope-isolation.mjs &&
          node --check scripts/verify-movie-mentor-operations-runtime-origin.mjs &&
          node --check scripts/verify-movie-mentor-operations-reality.mjs &&
          node --check scripts/verify-movie-mentor-operations-power.mjs &&
          node --check scripts/verify-movie-mentor-operations-soul.mjs &&
          node --check scripts/verify-movie-mentor-creator-revision-barrier.mjs &&
          node --check scripts/verify-movie-mentor-creator-branch-convergence.mjs &&
          node --check scripts/verify-movie-mentor-operations-infinity-gauntlet.mjs &&
          node --check scripts/verify-movie-mentor-operations-atomic-gauntlet.mjs &&
          node --check scripts/verify-movie-mentor-operations-distributed-effects.mjs &&
          node --check scripts/verify-movie-mentor-operations-reconciliation-lease.mjs &&
          node --check scripts/verify-movie-mentor-operations-lease-authority-quorum.mjs &&
          node --check scripts/verify-movie-mentor-operations-authority-reentry.mjs &&
          node --check scripts/verify-movie-mentor-operations-recovery-stability.mjs &&
          node --check scripts/verify-movie-mentor-post-catastrophe-recovery-certification.mjs &&
          node --check scripts/verify-movie-mentor-operations-catastrophe.mjs
      - name: Verify Movie Mentor semantic authority and safety
        run: npm run verify:movie-mentor-semantic
      - name: Verify Movie Mentor specialist authority and safety
        run: npm run verify:movie-mentor-specialists
      - name: Verify Movie Mentor synthesis authority and safety
        run: npm run verify:movie-mentor-synthesis
      - name: Verify Movie Mentor Operations architecture hardening v2
        run: npm run verify:movie-mentor-operations
      - name: Verify Movie Mentor Operations Warp 40 seams
        run: npm run verify:movie-mentor-operations-warp40
      - name: Verify Movie Mentor Operations replay freshness
        run: npm run verify:movie-mentor-operations-replay
      - name: Verify Movie Mentor Operations authoritative replay proof
        run: npm run verify:movie-mentor-operations-replay-proof
      - name: Verify Movie Mentor Operations atomic freshness
        run: npm run verify:movie-mentor-operations-atomic-freshness
      - name: Verify Movie Mentor Operations scope isolation
        run: npm run verify:movie-mentor-operations-scope
      - name: Verify Movie Mentor Operations runtime origin attestation
        run: npm run verify:movie-mentor-operations-runtime-origin
      - name: Verify Movie Mentor Operations reality evidence
        run: npm run verify:movie-mentor-operations-reality
      - name: Verify Movie Mentor Operations mutation capability power boundary
        run: npm run verify:movie-mentor-operations-power
      - name: Verify Movie Mentor creator work custody soul boundary
        run: npm run verify:movie-mentor-operations-soul
      - name: Verify Movie Mentor concurrent creator revision barrier
        run: npm run verify:movie-mentor-creator-revision-barrier
      - name: Verify Movie Mentor multi-device creator branch convergence
        run: npm run verify:movie-mentor-creator-branch-convergence
      - name: Verify Movie Mentor Infinity Gauntlet integration
        run: npm run verify:movie-mentor-operations-gauntlet
      - name: Verify Movie Mentor atomic Gauntlet mutation boundary
        run: npm run verify:movie-mentor-operations-atomic-gauntlet
      - name: Verify Movie Mentor distributed effect reconciliation
        run: npm run verify:movie-mentor-operations-distributed-effects
      - name: Verify Movie Mentor reconciliation lease split-brain fencing
        run: npm run verify:movie-mentor-operations-reconciliation-lease
      - name: Verify Movie Mentor lease authority quorum
        run: npm run verify:movie-mentor-operations-lease-authority-quorum
      - name: Verify Movie Mentor authority re-entry convergence
        run: npm run verify:movie-mentor-operations-authority-reentry
      - name: Verify Movie Mentor recovery anti-flapping stability
        run: npm run verify:movie-mentor-operations-recovery-stability
      - name: Verify Movie Mentor post-catastrophe recovery certification
        run: npm run verify:movie-mentor-post-catastrophe-certification
      - name: Verify Movie Mentor full Operations catastrophe recovery
        run: npm run verify:movie-mentor-operations-catastrophe
