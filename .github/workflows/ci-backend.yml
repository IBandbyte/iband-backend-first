name: CI (Backend)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check server syntax
        run: node --check server.js
      - name: Check Movie Mentor gateways and engines
        run: node --check movieMentorTurn.js && node --check movieMentorSemantic.js && node --check movieMentorSpecialists.js && node --check movieMentorSynthesis.js && node --check ai/MovieMentorCreatorStateStore.js && node --check ai/MovieMentorCreatorStateTransition.js && node --check ai/MovieMentorCreatorDecisionAuthority.js && node --check ai/MovieMentorCreatorTruthViewControl.js && node --check ai/MovieMentorContinuityConsequenceAuthority.js && node --check ai/MovieMentorContinuityDerivedCacheControl.js && node --check ai/MovieMentorContinuityDerivedCacheStore.js && node --check ai/MovieMentorContinuityAgent.js && node --check ai/MovieMentorTurnRuntime.js && node --check ai/MovieMentorTurnContextControl.js && node --check ai/MovieMentorTurnOrchestrator.js && node --check ai/MovieMentorContinuationReferenceControl.js && node --check ai/MovieMentorContinuationObedienceControl.js && node --check ai/MovieMentorSemanticInterpreter.js && node --check ai/StructuredAIProviderClient.js && node --check ai/MovieMentorSpecialistExecutor.js && node --check ai/MovieMentorSynthesisEngine.js && node --check scripts/verify-movie-mentor-continuation-reference.mjs && node --check scripts/verify-movie-mentor-continuation-obedience.mjs && node --check scripts/verify-movie-mentor-creator-decision-authority.mjs && node --check scripts/verify-movie-mentor-decision-propagation.mjs && node --check scripts/verify-movie-mentor-continuity-authority.mjs && node --check scripts/verify-movie-mentor-continuity-derived-cache.mjs && node --check scripts/verify-movie-mentor-continuity-cache-execution-bridge.mjs && node --check scripts/verify-movie-mentor-live-continuity-wiring.mjs && node --check scripts/verify-movie-mentor-project-session-continuity.mjs && node --check scripts/verify-movie-mentor-durable-round-trip.mjs && node --check scripts/verify-movie-mentor-creator-state-transition.mjs && node --check scripts/verify-movie-mentor-turn-runtime.mjs && node --check scripts/verify-movie-mentor-turn-orchestrator.mjs
      - name: Check Movie Mentor Operations catastrophe security syntax
        run: >-
          node --check ai/MovieMentorOperationsTrustedTimeAuthorityControl.js &&
          node --check ai/MovieMentorOperationsEvidenceAuthorityIndependenceControl.js &&
          node --check ai/MovieMentorPostCatastropheRecoveryCertification.js &&
          node --check ai/MovieMentorRecoveryRetryProofFreshnessControl.js &&
          node --check ai/MovieMentorRecoveryFinalizationRetryControl.js &&
          node --check scripts/verify-movie-mentor-post-catastrophe-recovery-certification.mjs &&
          node --check scripts/verify-movie-mentor-recovery-retry-snapshot-lineage-race.mjs &&
          node --check scripts/verify-movie-mentor-recovery-catastrophe-regression-matrix.mjs &&
          node --check scripts/verify-movie-mentor-adversarial-cross-layer-catastrophe-v2.mjs &&
          node --check scripts/verify-movie-mentor-operations-catastrophe.mjs
      - name: Verify Movie Mentor semantic authority and safety
        run: npm run verify:movie-mentor-semantic
      - name: Verify Movie Mentor continuation reference authority
        run: npm run verify:movie-mentor-continuation-reference
      - name: Verify Movie Mentor continuation obedience authority
        run: npm run verify:movie-mentor-continuation-obedience
      - name: Verify Movie Mentor creator decision authority
        run: npm run verify:movie-mentor-creator-decision
      - name: Verify Movie Mentor creator decision consequence propagation
        run: npm run verify:movie-mentor-decision-propagation
      - name: Verify Movie Mentor standalone continuity consequence authority
        run: npm run verify:movie-mentor-continuity-authority
      - name: Verify Movie Mentor continuity derived cache authority
        run: npm run verify:movie-mentor-continuity-derived-cache
      - name: Verify Movie Mentor cache-aware continuity execution bridge
        run: npm run verify:movie-mentor-continuity-cache-bridge
      - name: Verify Movie Mentor live continuity wiring
        run: npm run verify:movie-mentor-live-continuity
      - name: Verify Movie Mentor specialist authority and safety
        run: npm run verify:movie-mentor-specialists
      - name: Verify Movie Mentor synthesis authority and safety
        run: npm run verify:movie-mentor-synthesis
      - name: Verify Movie Mentor canonical turn wiring
        run: npm run verify:movie-mentor-turn
      - name: Verify Movie Mentor durable creator state turn runtime
        run: npm run verify:movie-mentor-turn-runtime
      - name: Verify Movie Mentor durable creator state transition boundary
        run: npm run verify:movie-mentor-creator-state-transition
      - name: Verify Movie Mentor project authority across working sessions
        run: npm run verify:movie-mentor-project-session-continuity
      - name: Verify Movie Mentor durable creator state round trip
        run: npm run verify:movie-mentor-durable-round-trip
      - name: Verify Movie Mentor Operations architecture hardening v2
        run: npm run verify:movie-mentor-operations
