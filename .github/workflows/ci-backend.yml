name: CI (Backend)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        # No package-lock.json is committed yet, so npm ci/cache would be false assurance.
        # Ignore dependency lifecycle scripts in CI until a reviewed lockfile is introduced.
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check server syntax
        run: node --check server.js
      - name: Check Movie Mentor gateways and engines
        run: node --check movieMentorSemantic.js && node --check movieMentorSpecialists.js && node --check movieMentorSynthesis.js && node --check ai/MovieMentorSemanticInterpreter.js && node --check ai/StructuredAIProviderClient.js && node --check ai/MovieMentorSpecialistExecutor.js && node --check ai/MovieMentorSynthesisEngine.js
      - name: Check Movie Mentor Operations control-plane syntax
        run: >-
          node --check ai/MovieMentorCanonicalAgentRegistry.js &&
          node --check ai/MovieMentorAgentAdmissionQuarantineControl.js &&
          node --check ai/MovieMentorAgentHealthIntegrityAgent.js &&
          node --check ai/MovieMentorOperationsSupervisor.js &&
          node --check ai/MovieMentorOperationsSupervisorAgent.js &&
          node --check ai/MovieMentorOperationsControlPlane.js &&
          node --check ai/MovieMentorOperationsStateMachine.js &&
          node --check ai/MovieMentorOperationsAuditIncidentLedger.js &&
          node --check ai/MovieMentorOperationsReplayFreshnessControl.js &&
          node --check ai/MovieMentorOperationsAtomicFreshnessGate.js &&
          node --check ai/MovieMentorOperationsScopeIsolationControl.js &&
          node --check ai/MovieMentorOperationsRuntimeOriginAttestation.js &&
          node --check ai/MovieMentorControlledRecoveryExecutor.js &&
          node --check ai/MovieMentorControlledRollbackExecutor.js &&
          node --check ai/MovieMentorRecoveryVerificationAgent.js &&
          node --check ai/MovieMentorPostRollbackVerificationAgent.js &&
          node --check ai/MovieMentorCreatorStateEmergencyPreservation.js &&
          node --check ai/MovieMentorExternalOperationsWatchdog.js &&
          node --check ai/MovieMentorRecoveryObjectivesPolicy.js &&
          node --check ai/MovieMentorOperationsFailureDrillControl.js &&
          node --check scripts/verify-movie-mentor-operations-v2.mjs &&
          node --check scripts/verify-movie-mentor-operations-warp40.mjs &&
          node --check scripts/verify-movie-mentor-operations-replay.mjs &&
          node --check scripts/verify-movie-mentor-operations-atomic-freshness.mjs &&
          node --check scripts/verify-movie-mentor-operations-scope-isolation.mjs &&
          node --check scripts/verify-movie-mentor-operations-runtime-origin.mjs
      - name: Verify Movie Mentor semantic authority and safety
        run: npm run verify:movie-mentor-semantic
      - name: Verify Movie Mentor specialist authority and safety
        run: npm run verify:movie-mentor-specialists
      - name: Verify Movie Mentor synthesis authority and safety
        run: npm run verify:movie-mentor-synthesis
      - name: Verify Movie Mentor Operations architecture hardening v2
        run: npm run verify:movie-mentor-operations
      - name: Verify Movie Mentor Operations Warp 40 seams
        run: npm run verify:movie-mentor-operations-warp40
      - name: Verify Movie Mentor Operations replay freshness
        run: npm run verify:movie-mentor-operations-replay
      - name: Verify Movie Mentor Operations atomic freshness
        run: npm run verify:movie-mentor-operations-atomic-freshness
      - name: Verify Movie Mentor Operations scope isolation
        run: npm run verify:movie-mentor-operations-scope
      - name: Verify Movie Mentor Operations runtime origin attestation
        run: npm run verify:movie-mentor-operations-runtime-origin
