name: Verify Movie Mentor Inference Spend Reservation Create Rollback

on:
  pull_request:
    paths:
      - "ai/MovieMentorInferenceSpendMongoStore.js"
      - "scripts/verify-movie-mentor-inference-spend-reservation-create-rollback.mjs"
      - ".github/workflows/verify-movie-mentor-inference-spend-reservation-create-rollback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check verifier syntax
        run: node --check scripts/verify-movie-mentor-inference-spend-reservation-create-rollback.mjs
      - name: Verify reservation create rollback
        run: node scripts/verify-movie-mentor-inference-spend-reservation-create-rollback.mjs
