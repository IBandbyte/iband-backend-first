name: Verify Movie Mentor Journey Recovery Authentication Configuration Authority

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check authentication configuration authority
        run: node --check ai/MovieMentorJourneyRecoveryAuthenticationConfigurationAuthority.js

      - name: Syntax check authentication configuration torture
        run: node --check scripts/verify-movie-mentor-journey-recovery-authentication-configuration-authority.mjs

      - name: Verify authentication configuration authority
        run: node scripts/verify-movie-mentor-journey-recovery-authentication-configuration-authority.mjs
