name: Verify Movie Mentor Provider Ingress Reversal Owner Proof

on:
  pull_request:
    paths:
      - 'ai/MovieMentorProductionCommercialReversalComposition.js'
      - 'ai/MovieMentorProductionCommercialProviderIngressComposition.js'
      - 'scripts/verify-movie-mentor-provider-ingress-reversal-owner-proof.mjs'
      - '.github/workflows/verify-movie-mentor-provider-ingress-reversal-owner-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check scripts/verify-movie-mentor-provider-ingress-reversal-owner-proof.mjs
      - run: node scripts/verify-movie-mentor-provider-ingress-reversal-owner-proof.mjs
