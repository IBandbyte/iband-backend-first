name: Verify Movie Mentor Gates of Execution Provider Effect Cross-Ledger Admission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-provider-effect-cross-ledger-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Syntax check production store
        run: node --check ai/MovieMentorProviderEffectMongoStore.js
      - name: Syntax check adversarial verifier
        run: node --check scripts/verify-movie-mentor-provider-effect-cross-ledger-admission.mjs
      - name: Verify provider effect cross-ledger admission
        run: node scripts/verify-movie-mentor-provider-effect-cross-ledger-admission.mjs
