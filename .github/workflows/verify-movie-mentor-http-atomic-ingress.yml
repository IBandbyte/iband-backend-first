name: Verify Movie Mentor HTTP Atomic Ingress
on:
  push:
    branches:
      - verify/creator-state-sync-provenance-court-20261103
  workflow_dispatch:
jobs:
  http-atomic-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify both HTTP atomic ingress boundaries
        run: node scripts/verify-movie-mentor-http-atomic-ingress.mjs
