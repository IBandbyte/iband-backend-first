name: Verify Movie Mentor Offline Clerk Revocation Characterization
on:
  push:
    branches:
      - verify/creator-atomic-production-mount-court-20261104
  workflow_dispatch:
jobs:
  offline-revocation-characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Characterize offline JWT revocation visibility
        run: node scripts/verify-movie-mentor-offline-clerk-revocation-characterization.mjs
