name: Verify Movie Mentor Quarantine Missing Barrier Revision Authority
on:
  pull_request:
  push:
    paths:
      - ai/MovieMentorInferenceExecutionMongoStore.js
      - scripts/verify-movie-mentor-quarantine-missing-barrier-revision-authority.mjs
      - .github/workflows/verify-movie-mentor-quarantine-missing-barrier-revision-authority.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-quarantine-missing-barrier-revision-authority.mjs
