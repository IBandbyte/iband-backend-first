name: Verify Movie Mentor Creator Operation Legacy Denial
on:
  workflow_dispatch:
  push:
    branches:
      - verify/creator-atomic-production-mount-court-20261104
    paths:
      - ".github/workflows/verify-movie-mentor-creator-operation-legacy-denial.yml"
      - "scripts/verify-movie-mentor-creator-operation-legacy-denial.mjs"
      - "ai/MovieMentorCreatorStateTransition.js"
jobs:
  operation-legacy-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: node scripts/verify-movie-mentor-creator-operation-legacy-denial.mjs
