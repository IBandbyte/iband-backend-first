name: Verify Movie Mentor Journey Recovery Store

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/verify-movie-mentor-journey-recovery-store.yml"
      - "ai/MovieMentorJourneyRecoveryEnvelope.js"
      - "ai/MovieMentorJourneyRecoveryStore.js"
      - "ai/MovieMentorJourneyRecoveryTransition.js"
      - "scripts/verify-movie-mentor-journey-recovery-store.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-movie-mentor-journey-recovery-store.yml"
      - "ai/MovieMentorJourneyRecoveryEnvelope.js"
      - "ai/MovieMentorJourneyRecoveryStore.js"
      - "ai/MovieMentorJourneyRecoveryTransition.js"
      - "scripts/verify-movie-mentor-journey-recovery-store.mjs"

permissions:
  contents: read

jobs:
  journey-recovery-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check recovery store syntax
        run: node --check ai/MovieMentorJourneyRecoveryEnvelope.js && node --check ai/MovieMentorJourneyRecoveryStore.js && node --check ai/MovieMentorJourneyRecoveryTransition.js && node --check scripts/verify-movie-mentor-journey-recovery-store.mjs
      - name: Torture backend recovery CAS and anti-rollback law
        run: node scripts/verify-movie-mentor-journey-recovery-store.mjs
