name: Verify Movie Mentor Idempotent Authority Downstream Propagation
on:
  push:
    branches: [audit/creator-first-commit-takeover-verifier]
    paths:
      - scripts/verify-movie-mentor-idempotent-authority-downstream-propagation.mjs
      - .github/workflows/verify-movie-mentor-idempotent-authority-downstream-propagation.yml
  workflow_dispatch:
jobs:
  propagation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/verify-movie-mentor-idempotent-authority-downstream-propagation.mjs
      - run: node scripts/verify-movie-mentor-idempotent-authority-downstream-propagation.mjs
