name: Verify Movie Mentor Turn Reservation Meaning Conflict Authority
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check scripts/verify-movie-mentor-turn-reservation-meaning-conflict-authority.mjs
      - run: node scripts/verify-movie-mentor-turn-reservation-meaning-conflict-authority.mjs
