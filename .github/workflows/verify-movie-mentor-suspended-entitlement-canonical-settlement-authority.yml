name: Verify Movie Mentor Suspended Entitlement Canonical Settlement Authority

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-movie-mentor-suspended-entitlement-canonical-settlement-authority.mjs
