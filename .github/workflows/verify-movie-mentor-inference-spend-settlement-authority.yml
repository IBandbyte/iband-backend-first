name: Verify Movie Mentor Inference Spend Settlement Authority
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check 5A.8 syntax
        run: node --check ai/MovieMentorInferenceSpendMongoStore.js && node --check ai/MovieMentorInferenceSpendAuthority.js && node --check ai/MovieMentorTurnRuntime.js && node --check scripts/verify-movie-mentor-inference-spend-settlement-authority.mjs
      - name: Verify 5A.8 settlement authority
        run: node scripts/verify-movie-mentor-inference-spend-settlement-authority.mjs
      - name: Regress sealed 5A.7 commercial evidence
        run: node scripts/verify-movie-mentor-commercial-payment-evidence-authority.mjs
      - name: Regress sealed 5A.6 entitlement issuance
        run: node scripts/verify-movie-mentor-entitlement-issuance-authority.mjs
      - name: Regress sealed 5A.5 inference spend reservation
        run: node scripts/verify-movie-mentor-inference-spend-authority.mjs
      - name: Regress turn runtime
        run: node scripts/verify-movie-mentor-turn-runtime.mjs
