name: Verify Movie Mentor Commercial Purchase Intent Authority
on:
  push:
    branches: [main]
    paths:
      - 'ai/MovieMentorCommercialPurchaseIntentMongoStore.js'
      - 'ai/MovieMentorCommercialPurchaseIntentAuthority.js'
      - 'ai/MovieMentorProductionCommercialPurchaseIntentComposition.js'
      - 'ai/MovieMentorCommercialPaymentEvidenceAuthority.js'
      - 'scripts/verify-movie-mentor-commercial-purchase-intent-authority.mjs'
      - '.github/workflows/verify-movie-mentor-commercial-purchase-intent-authority.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check 5A.9 syntax
        run: node --check ai/MovieMentorCommercialPurchaseIntentMongoStore.js && node --check ai/MovieMentorCommercialPurchaseIntentAuthority.js && node --check ai/MovieMentorProductionCommercialPurchaseIntentComposition.js && node --check ai/MovieMentorCommercialPaymentEvidenceAuthority.js
      - name: Verify 5A.9 purchase intent authority
        run: node scripts/verify-movie-mentor-commercial-purchase-intent-authority.mjs
      - name: Regress sealed 5A.8 settlement
        run: node scripts/verify-movie-mentor-inference-spend-settlement-authority.mjs
      - name: Regress sealed 5A.7 commercial evidence
        run: node scripts/verify-movie-mentor-commercial-payment-evidence-authority.mjs
      - name: Regress sealed 5A.6 entitlement issuance
        run: node scripts/verify-movie-mentor-entitlement-issuance-authority.mjs
      - name: Regress sealed 5A.5 inference spend
        run: node scripts/verify-movie-mentor-inference-spend-authority.mjs
