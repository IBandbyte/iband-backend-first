name: Verify Movie Mentor Project Ownership Physical Authority

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-project-ownership-physical-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run project ownership physical authority verifier
        run: node scripts/verify-movie-mentor-project-ownership-physical-authority.mjs
