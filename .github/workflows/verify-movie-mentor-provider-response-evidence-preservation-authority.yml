name: Verify Movie Mentor Provider Response Evidence Preservation Authority

on:
  pull_request:
    paths:
      - "ai/StructuredAIProviderClient.js"
      - "ai/MovieMentorSemanticInterpreter.js"
      - "scripts/verify-movie-mentor-provider-response-evidence-preservation-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-response-evidence-preservation-authority.yml"
  push:
    branches: [main]
    paths:
      - "ai/StructuredAIProviderClient.js"
      - "ai/MovieMentorSemanticInterpreter.js"
      - "scripts/verify-movie-mentor-provider-response-evidence-preservation-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-response-evidence-preservation-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check provider response evidence preservation authority syntax
        run: |
          node --check ai/StructuredAIProviderClient.js
          node --check ai/MovieMentorSemanticInterpreter.js
          node --check scripts/verify-movie-mentor-provider-response-evidence-preservation-authority.mjs
      - name: Verify provider response evidence preservation authority
        run: node scripts/verify-movie-mentor-provider-response-evidence-preservation-authority.mjs
