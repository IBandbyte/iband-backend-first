name: Verify Movie Mentor Provider Effect Current Execution Schema Authority
on:
  pull_request:
    branches: [main]
    paths:
      - "ai/MovieMentorProviderEffectMongoStore.js"
      - "scripts/verify-movie-mentor-provider-effect-current-execution-schema-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-effect-current-execution-schema-authority.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --check ai/MovieMentorProviderEffectMongoStore.js
      - run: node --check scripts/verify-movie-mentor-provider-effect-current-execution-schema-authority.mjs
      - run: node scripts/verify-movie-mentor-provider-effect-current-execution-schema-authority.mjs
