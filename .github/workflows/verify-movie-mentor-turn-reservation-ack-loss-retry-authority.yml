name: Verify Movie Mentor Turn Reservation Ack Loss Retry Authority

on:
  pull_request:
    paths:
      - "ai/MovieMentorTurnRuntime.js"
      - "scripts/verify-movie-mentor-turn-reservation-ack-loss-retry-authority.mjs"
      - ".github/workflows/verify-movie-mentor-turn-reservation-ack-loss-retry-authority.yml"
  workflow_dispatch:

jobs:
  verify-turn-reservation-ack-loss-retry-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify turn reservation acknowledgement-loss retry authority
        run: node scripts/verify-movie-mentor-turn-reservation-ack-loss-retry-authority.mjs
