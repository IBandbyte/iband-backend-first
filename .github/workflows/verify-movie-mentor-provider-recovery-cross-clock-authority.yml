name: Verify Movie Mentor Provider Recovery Cross Clock Authority
on:
  push:
    paths:
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "scripts/verify-movie-mentor-provider-recovery-cross-clock-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-recovery-cross-clock-authority.yml"
  pull_request:
    paths:
      - "ai/MovieMentorInferenceExecutionLeaseAuthority.js"
      - "scripts/verify-movie-mentor-provider-recovery-cross-clock-authority.mjs"
      - ".github/workflows/verify-movie-mentor-provider-recovery-cross-clock-authority.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node scripts/verify-movie-mentor-provider-recovery-cross-clock-authority.mjs
