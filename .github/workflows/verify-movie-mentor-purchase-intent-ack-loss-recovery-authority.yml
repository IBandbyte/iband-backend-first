name: Verify Movie Mentor Purchase Intent ACK-Loss Recovery Authority

on:
  pull_request:
    paths:
      - "ai/MovieMentorCommercialPurchaseIntentAuthority.js"
      - "ai/MovieMentorCommercialPurchaseIntentMongoStore.js"
      - "scripts/verify-movie-mentor-purchase-intent-ack-loss-recovery-authority.mjs"
      - ".github/workflows/verify-movie-mentor-purchase-intent-ack-loss-recovery-authority.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/verify-movie-mentor-purchase-intent-ack-loss-recovery-authority.mjs
