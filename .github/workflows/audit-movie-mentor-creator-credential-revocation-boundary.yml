name: Audit Movie Mentor Creator Credential Revocation Boundary
on:
  push:
    branches:
      - audit/creator-credential-revocation-court-20261107
  workflow_dispatch:
jobs:
  credential-revocation-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact head and original RED unchanged
        shell: bash
        run: |
          set -euo pipefail
          echo "AUDIT_SHA=$(git rev-parse HEAD)"
          git cat-file -e 7188ef1a300b9df30e3a460945963de81c84c74d^{commit}
          git diff --exit-code 7188ef1a300b9df30e3a460945963de81c84c74d HEAD -- scripts/verify-movie-mentor-creator-state-mongo-postcheck-revocation.mjs
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without a repository lockfile
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Verify credential revocation at pre-mutation authority boundary
        run: node scripts/verify-movie-mentor-creator-credential-revocation-boundary.mjs
